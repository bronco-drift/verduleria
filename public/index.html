<style>
:root{
  /* paper neutrals — warm hue 75 */
  --bg:oklch(96.5% 0.005 75);
  --surface:oklch(99% 0.003 75);
  --surface-2:oklch(94% 0.006 75);
  --surface-3:oklch(91% 0.008 75);
  --border:oklch(89% 0.008 75);
  --border-strong:oklch(82% 0.012 75);
  /* ink — cool carbon hue 250 */
  --ink:oklch(24% 0.015 250);
  --ink-soft:oklch(48% 0.012 250);
  --ink-mute:oklch(60% 0.010 250);
  --ink-faint:oklch(72% 0.008 250);
  /* brand — deep petrol blue hue 220 */
  --brand:oklch(40% 0.085 220);
  --brand-hover:oklch(33% 0.095 220);
  --brand-tint:oklch(94% 0.018 220);
  --on-brand:oklch(98% 0.003 220);
  /* semantic — verde queda solo para success */
  --success:oklch(48% 0.10 145);
  --success-bg:oklch(93% 0.035 145);
  --success-fg:oklch(34% 0.08 145);
  --warn:oklch(58% 0.12 70);
  --warn-bg:oklch(94% 0.045 75);
  --warn-fg:oklch(40% 0.09 70);
  --danger:oklch(50% 0.14 25);
  --danger-bg:oklch(94% 0.05 25);
  --danger-fg:oklch(35% 0.10 25);
  --info:oklch(45% 0.12 250);
  --info-bg:oklch(94% 0.035 250);
  --accent-purple:oklch(45% 0.13 295);
  /* shape */
  --r-sm:5px;
  --r-md:7px;
  --r-lg:9px;
  /* shadow */
  --shadow-sm:0 1px 2px oklch(20% 0.01 250 / 0.06);
  --shadow-md:0 2px 12px oklch(20% 0.01 250 / 0.10);
  --shadow-lg:0 6px 30px oklch(20% 0.01 250 / 0.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;padding:calc(1.5rem + env(safe-area-inset-top,0px)) max(1.5rem,env(safe-area-inset-right,0px)) calc(1.5rem + env(safe-area-inset-bottom,0px)) max(1.5rem,env(safe-area-inset-left,0px));min-height:100dvh}
@media(max-width:640px){body{padding:calc(.875rem + env(safe-area-inset-top,0px)) max(.875rem,env(safe-area-inset-right,0px)) calc(.875rem + env(safe-area-inset-bottom,0px)) max(.875rem,env(safe-area-inset-left,0px))}}
h1{font-size:22px;font-weight:700;margin-bottom:.25rem;color:var(--ink);letter-spacing:-0.015em}
.subtitle{font-size:13px;color:var(--ink-soft);margin-bottom:1.25rem}
/* Topbar with admin button on right */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:1.25rem;flex-wrap:nowrap}
.topbar-title{flex:1;min-width:0}
.topbar-title h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-title .subtitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-title h1{margin-bottom:.25rem}
.topbar-title .subtitle{margin-bottom:0}
.admin-trigger{height:36px;padding:0 16px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.admin-trigger:hover{background:var(--brand-hover)}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
/* Sub-header: nombre del local actual (cambia por tenant) */
.store-banner{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:1rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;flex-wrap:wrap}
.store-banner-icon{font-size:24px;line-height:1;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--brand-tint);border-radius:9px;flex-shrink:0}
.store-banner-info{flex:1;min-width:200px;display:flex;flex-direction:column;gap:1px}
.store-banner-name{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-0.01em}
.store-banner-meta{font-size:11px;color:var(--ink-soft);line-height:1.4}
.store-banner-status{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase}
.store-banner-status.on{background:var(--success-bg);color:var(--success-fg)}
.store-banner-status.off{background:var(--warn-bg);color:var(--warn-fg)}
.info-trigger,.view-trigger{height:36px;padding:0 14px;background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.info-trigger:hover,.view-trigger:hover{background:var(--bg);border-color:var(--brand);color:var(--brand)}
.view-trigger.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.view-trigger.on:hover{background:var(--brand-hover);color:#fff}
.ta-icon{font-size:14px;line-height:1}
.ta-label{font-size:13px}
/* Mobile: icon-only buttons, subtitle hidden, h1 still readable */
@media(max-width:640px){
  .topbar{gap:8px}
  .topbar-title .subtitle{display:none}
  .info-trigger,.admin-trigger,.view-trigger{padding:0;width:36px;justify-content:center;gap:0}
  .ta-label{display:none}
  .ta-icon{font-size:16px}
}
/* Vista final: oculta toda la maquinaria de admin */
body.vista-final .group-pills{display:none}
body.vista-final .store-banner{display:none}
body.vista-final .admin-trigger{display:none}
body.vista-final .topbar-title .subtitle{display:block;font-weight:600;color:var(--ink)}
@media(max-width:640px){body.vista-final .topbar-title .subtitle{display:block}}
/* Rol socio: gestión de su restaurante, sin admin global */
body[data-role="socio"] .admin-trigger{display:none}
/* Cliente: sin barra de tabs (navega home→tienda con botones) */
body.vista-final .tabs{display:none}
/* Un solo grupo por rol: pills redundantes fuera para socio/admin/rider */
body[data-role="socio"] .group-pills,body[data-role="admin"] .group-pills,body[data-role="rider"] .group-pills{display:none}
/* Rider: el banner del restaurante activo no aplica */
body[data-role="rider"] .store-banner{display:none}
/* Entregas del rider */
.rider-head{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;flex-wrap:wrap}
.rider-head select{height:34px;padding:0 10px;font-size:13px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.rider-head .rh-stats{margin-left:auto;font-size:11px;color:var(--ink-soft);display:flex;gap:14px}
.rider-head .rh-stats strong{color:var(--ink)}
.entrega-card{display:flex;flex-direction:column;gap:8px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.entrega-card+.entrega-card{margin-top:10px}
.entrega-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.entrega-rest{font-size:14px;font-weight:700;letter-spacing:-0.01em;color:var(--ink);flex:1;min-width:180px}
.entrega-total{font-size:15px;font-weight:700;color:var(--ink)}
.entrega-ruta{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft)}
.entrega-ruta .er-row{display:flex;gap:8px;align-items:baseline}
.entrega-ruta .er-row span:first-child{flex-shrink:0}
.entrega-acciones{display:flex;gap:8px;margin-top:2px}
.entrega-acciones button{height:34px;padding:0 16px;font-size:12px;font-weight:600;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.entrega-acciones button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.entrega-acciones button.primary:hover{background:var(--brand-hover)}
.rider-section-title{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.pedido-status.en_camino{background:var(--info-bg);color:var(--info)}
/* Barra de rol (desarrollo) */
.dev-role-bar{display:flex;align-items:center;gap:12px;padding:7px 12px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:9px;font-size:11px;flex-wrap:wrap}
.drb-label{font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.drb-group{display:flex;gap:4px;padding:3px;background:var(--surface-2);border-radius:8px}
.drb-btn{height:26px;padding:0 14px;border:none;background:transparent;color:var(--ink-soft);font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;transition:background .15s,color .15s}
.drb-btn:hover{color:var(--ink)}
.drb-btn.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.drb-note{color:var(--ink-faint);font-size:10px;margin-left:auto}
@media(max-width:640px){.drb-note{display:none}}
/* Selector de rider: visible solo en rol rider, al lado del switch de roles */
.drb-rider-sel{display:none;height:26px;padding:0 8px;font-size:11px;font-weight:600;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--ink)}
body[data-role="rider"] .drb-rider-sel{display:block}
/* Mapa de ruta por entrega */
.ruta-map-wrap{display:none;height:190px;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-top:4px}
.ruta-map-wrap.show{display:block}
.ruta-pin-in{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #18181b;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.rh-nombre{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px}
/* Botón Mis pedidos (topbar, solo vista cliente) */
.mis-pedidos-trigger{display:none;position:relative}
body.vista-final .mis-pedidos-trigger{display:flex}
.mp-badge{display:none;position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;align-items:center;justify-content:center;line-height:1}
.mp-badge.show{display:flex}
/* Pantalla Mis pedidos (cliente) */
.mp-head{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.mp-head h2{font-size:18px;margin:0}
.mp-volver{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
.mp-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.mp-card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mp-rest{font-size:14px}
.mp-meta{font-size:11px;color:var(--ink-faint)}
.mp-total{margin-left:auto;font-weight:800;font-size:14px}
.mp-msg{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.mp-items{font-size:12px;color:var(--ink-soft);margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.mp-entrega{font-size:12px;color:var(--ink-faint);margin-top:4px}
.mp-past{opacity:.85}
/* Stepper de estado del pedido */
.mp-steps{display:flex;margin:12px 0 8px}
.mp-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.mp-step::before{content:"";position:absolute;top:8px;right:50%;width:100%;height:2px;background:var(--border-strong)}
.mp-step:first-child::before{display:none}
.mp-step.done::before,.mp-step.now::before{background:var(--ink)}
.mp-dot{width:17px;height:17px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong);z-index:1;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;box-sizing:border-box}
.mp-step.done .mp-dot{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mp-step.now .mp-dot{border-color:var(--ink);animation:mpPulse 1.8s ease-in-out infinite}
.mp-lbl{font-size:9px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;text-align:center;line-height:1.2}
.mp-step.done .mp-lbl,.mp-step.now .mp-lbl{color:var(--ink)}
@keyframes mpPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,.18)}50%{box-shadow:0 0 0 6px rgba(0,0,0,0)}}
/* Modal pedido exitoso */
.exito-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;opacity:0;pointer-events:none;transition:opacity .2s}
.exito-overlay.open{opacity:1;pointer-events:auto}
.exito-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);z-index:10001;background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:26px 22px;width:min(400px,calc(100vw - 32px));box-shadow:0 24px 70px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;text-align:center}
.exito-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.exito-check{width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;animation:exitoPop .35s ease}
@keyframes exitoPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.exito-modal h2{font-size:19px;margin:0 0 4px}
.exito-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}
.exito-datos{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:16px;text-align:left}
.ed-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.ed-row span{color:var(--ink-faint)}
.exito-acciones{display:flex;flex-direction:column;gap:8px}
.exito-acciones button{width:100%;padding:10px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.exito-acciones button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
/* Perfil de usuario (topbar 👤, solo vista cliente) */
.perfil-trigger{display:none}
body.vista-final .perfil-trigger{display:flex}
.perfil-sec{margin-bottom:18px}
.perfil-sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:0 0 8px}
.perfil-sec .form-field{margin-bottom:8px}
.pf-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;cursor:pointer}
.pf-toggle .pf-t-txt{font-size:12.5px;font-weight:600;color:var(--ink)}
.pf-toggle .pf-t-sub{display:block;font-size:11px;font-weight:400;color:var(--ink-faint)}
.pf-guardar{width:100%;padding:11px;border-radius:9px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.pf-ayuda{display:block;text-align:center;margin-top:12px;font-size:12px;color:var(--ink-faint);cursor:pointer;text-decoration:underline}
/* Resumen tipo ticket */
.resumen-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);z-index:10001;background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:20px 18px;width:min(430px,calc(100vw - 32px));max-height:min(86dvh,720px);overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
.resumen-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.tkt-head{text-align:center;border-bottom:1px dashed var(--border-strong);padding-bottom:10px;margin-bottom:10px}
.tkt-head .tkt-rest{font-size:16px;font-weight:800}
.tkt-head .tkt-sub{font-size:11px;color:var(--ink-faint);margin-top:2px}
.tkt-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2.5px 0;color:var(--ink)}
.tkt-row .tkt-n{flex:1}
.tkt-row .tkt-q{color:var(--ink-faint);white-space:nowrap}
.tkt-row strong{white-space:nowrap}
.tkt-sep{border-top:1px dashed var(--border-strong);margin:8px 0}
.tkt-total{display:flex;justify-content:space-between;font-size:16px;font-weight:800;padding:4px 0}
.tkt-datos{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:12px;margin-top:10px}
.tkt-datos .td-row{display:flex;gap:8px;padding:2px 0}
.tkt-datos .td-row span{color:var(--ink-faint);min-width:74px}
/* Diagrama del sistema (tab dev en admin) */
.sys-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:10px}
.sys-svg{min-width:860px;width:100%;height:auto;display:block}
.sys-svg .nodo{fill:var(--bg);stroke:var(--border-strong);stroke-width:1.2;rx:10}
.sys-svg .nodo-hl{fill:var(--bg);stroke:var(--ink);stroke-width:1.6}
.sys-svg .tit{fill:var(--ink);font-size:13px;font-weight:800}
.sys-svg .sub{fill:var(--ink-faint);font-size:10.5px}
.sys-svg .dato{fill:var(--ink);font-size:10.5px;font-weight:600}
.sys-svg .fl{stroke:var(--ink);stroke-width:1.4;fill:none;marker-end:url(#sys-arr)}
.sys-svg .fl-soft{stroke:var(--ink-faint);stroke-width:1.2;stroke-dasharray:5 4;fill:none;marker-end:url(#sys-arr-soft)}
.sys-svg .fl-lbl{fill:var(--ink-soft);font-size:10px;font-weight:600}
.sys-svg .stor{fill:var(--surface);stroke:var(--border)}
.sys-svg .stor-t{fill:var(--ink-faint);font-size:9.5px;font-family:ui-monospace,monospace}
.sys-capas{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.sys-chip{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.sys-chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sys-svg .nodo-id{fill:var(--bg);stroke:var(--info,#2563EB);stroke-width:1.6}
.sys-svg .tit-id{fill:var(--info,#2563EB);font-size:13px;font-weight:800}
.sys-svg .fl-id{stroke:var(--info,#2563EB);stroke-width:1.3;stroke-dasharray:6 5;fill:none;marker-end:url(#sys-arr-id);opacity:.85}
.sys-svg .fl-id-lbl{fill:var(--info,#2563EB);font-size:10px;font-weight:700}
.sys-svg .ghost{fill:transparent;stroke:var(--ink-faint);stroke-dasharray:6 5;stroke-width:1.1}
.sys-svg .ghost-t{fill:var(--ink-soft);font-size:12px;font-weight:800}
/* Home del cliente: elegir restaurante */
.home-hero{margin:6px 0 16px}
.home-hero h2{font-size:22px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);margin-bottom:4px}
.home-hero p{font-size:13px;color:var(--ink-soft)}
.home-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.home-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:border-color .2s}
.home-card:hover{border-color:oklch(22% 0.005 250 / .3)}
.home-card.cerrado{opacity:.6}
.home-card-icon{width:52px;height:52px;font-size:28px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:12px;flex-shrink:0}
.home-card-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.home-card-name{font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--ink)}
.home-card-meta{font-size:12px;color:var(--ink-soft)}
.home-card-tags{font-size:11px;color:var(--ink-mute);display:flex;gap:10px}
/* Volver al listado (solo vista cliente) */
.volver-locales{display:none;align-items:center;gap:6px;height:32px;padding:0 12px;margin-bottom:12px;background:transparent;border:1px solid var(--border-strong);border-radius:8px;color:var(--ink-soft);font-size:12px;font-weight:600;cursor:pointer}
.volver-locales:hover{color:var(--ink);border-color:var(--brand)}
body.vista-final .volver-locales{display:inline-flex}
/* Info drawer */
.info-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998;display:none}
.info-overlay.open{display:block}
.info-drawer{position:fixed;top:0;right:0;width:min(560px,100vw);height:100vh;height:100dvh;background:var(--bg);z-index:9999;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;box-shadow:-6px 0 30px rgba(0,0,0,.18);padding-right:env(safe-area-inset-right,0px)}
.info-drawer.open{transform:translateX(0)}
.info-head{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;background:var(--brand);color:#fff;gap:8px}
.info-head h2{font-size:16px;font-weight:700;flex:1}
.info-head .cart-close{color:#fff;background:rgba(255,255,255,.15)}
.info-head .cart-close:hover{background:rgba(255,255,255,.25)}
.info-body{flex:1;overflow-y:auto;padding:18px}
.info-tenant-card{padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:18px}
.info-tenant-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.info-tenant-icon{font-size:32px;line-height:1;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--brand-tint);border-radius:12px;flex-shrink:0}
.info-tenant-name{flex:1}
.info-tenant-name h3{font-size:17px;font-weight:700;color:var(--ink);margin:0 0 3px;letter-spacing:-0.01em}
.info-tenant-name .meta{font-size:12px;color:var(--ink-soft)}
.info-contact-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;font-size:12px}
.info-contact-row > div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--bg);border-radius:7px}
.info-contact-row > div span{font-size:10px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.info-contact-row > div strong{color:var(--ink);font-weight:600;font-size:12px}
.info-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.info-section-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;user-select:none}
.info-section-head h4{font-size:13px;font-weight:700;color:var(--ink);margin:0;display:flex;align-items:center;gap:8px}
.info-section-head .info-chev{font-size:13px;color:var(--ink-soft);transition:transform .2s}
.info-section.open .info-chev{transform:rotate(180deg)}
.info-section-body{display:none;padding:0 16px 14px;color:var(--ink-soft);font-size:12px;line-height:1.6}
.info-section.open .info-section-body{display:block}
.info-zona-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.info-zona-row{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;background:var(--bg);border-radius:7px;font-size:12px}
.info-zona-row .nz{font-weight:600;color:var(--ink)}
.info-zona-row .meta{color:var(--ink-soft);font-size:11px;text-align:right}
.info-faq-list{display:flex;flex-direction:column;gap:4px}
.info-faq-item{padding:10px 12px;background:var(--bg);border-radius:7px}
.info-faq-item .q{font-weight:600;color:var(--ink);font-size:12px;margin-bottom:3px}
.info-faq-item .a{color:var(--ink-soft);font-size:12px;line-height:1.55}
.info-steps{display:flex;flex-direction:column;gap:8px;counter-reset:step}
.info-step{display:flex;gap:10px;padding:8px 0;counter-increment:step}
.info-step::before{content:counter(step);width:24px;height:24px;background:var(--brand);color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.info-step strong{color:var(--ink);font-weight:600;display:block;margin-bottom:2px;font-size:12px}
.info-step span{color:var(--ink-soft);font-size:12px;line-height:1.5}

/* Site footer */
.site-footer{margin-top:2rem;padding:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--ink-soft);font-size:12px}
.footer-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:22px;margin-bottom:1.25rem}
.footer-col h4{font-size:11px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.footer-col a,.footer-col .fl{display:block;color:var(--ink-soft);text-decoration:none;font-size:12px;line-height:1.9;cursor:pointer}
.footer-col a:hover,.footer-col .fl:hover{color:var(--brand)}
.footer-col .fl-meta{font-size:11px;color:var(--ink-mute);line-height:1.6}
.footer-bottom{padding-top:1rem;border-top:1px solid var(--border);font-size:11px;color:var(--ink-mute);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
/* Group pills */
.group-pills{display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:.75rem}
.group-pill{padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;border:1px solid transparent;border-radius:8px;background:transparent;display:flex;align-items:center;gap:7px;transition:all .15s}
.group-pill:hover{color:var(--ink);background:var(--surface-2)}
.group-pill.on{color:#fff;background:var(--brand);border-color:var(--brand)}
.group-pill-icon{font-size:14px;line-height:1}
.group-pill-count{font-size:10px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(0,0,0,.10);color:inherit;margin-left:2px}
.group-pill.on .group-pill-count{background:rgba(255,255,255,.25)}
/* Admin drawer */
.admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998;display:none}
.admin-overlay.open{display:block}
.admin-drawer{position:fixed;top:0;right:0;width:min(720px,100vw);height:100vh;height:100dvh;background:var(--bg);z-index:9999;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;box-shadow:-6px 0 30px rgba(0,0,0,.18);padding-right:env(safe-area-inset-right,0px)}
.admin-drawer.open{transform:translateX(0)}
.admin-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;background:var(--brand);color:#fff}
.admin-drawer-head h2{font-size:16px;font-weight:700}
.admin-close{width:32px;height:32px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:16px;cursor:pointer;border-radius:7px;display:flex;align-items:center;justify-content:center}
.admin-close:hover{background:rgba(255,255,255,.25)}
.admin-drawer-body{flex:1;overflow-y:auto;padding:18px}
.tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:2px solid var(--border);overflow-x:auto}
.tab{padding:8px 16px;font-size:12px;font-weight:500;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .15s}
.tab.on{color:var(--ink);border-bottom-color:var(--brand)}
.tab:hover{color:var(--ink)}
.panel{display:none}.panel.on{display:block}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.top input[type=text]{height:34px;padding:0 12px;font-size:13px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);min-width:180px}
.top input[type=text]:focus{outline:none;border-color:var(--brand)}
.fbts{display:flex;gap:6px;flex-wrap:wrap}
.fb{font-size:11px;padding:4px 11px;border-radius:999px;border:1px solid var(--border-strong);background:transparent;color:var(--ink-soft);cursor:pointer}
.fb.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:500}
.leg{display:flex;gap:14px;margin-bottom:.75rem;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ow{overflow-x:auto;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:700px}
th{background:var(--surface-2);padding:8px 10px;font-weight:600;font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--border);white-space:nowrap;text-align:center;cursor:pointer}
th:first-child{text-align:left;cursor:default}
th.sortable:hover{background:var(--surface-3);color:var(--ink)}
th .arr{font-size:9px;margin-left:3px;opacity:.5}
th.asc .arr::after{content:"▲";opacity:1}
th.desc .arr::after{content:"▼";opacity:1}
th:not(.asc):not(.desc) .arr::after{content:"⇅"}
th.grp{border-left:2px solid var(--border-strong)}
td{padding:7px 10px;vertical-align:middle;text-align:center;border-bottom:1px solid var(--surface-2)}
td:first-child{text-align:left}
td.grp{border-left:2px solid var(--border)}
tr:hover td{background:var(--surface-2)}
tr.cr td{background:var(--surface-2);font-weight:700;font-size:10px;color:var(--ink-soft);padding:5px 10px;text-align:left;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
.p{font-size:12px;font-weight:600;display:inline-block}
.p.b{background:var(--success-bg);color:var(--success-fg);border-radius:5px;padding:1px 7px}
.p.n{color:var(--ink-faint);font-weight:400;font-size:11px}
.p.av{color:var(--ink-soft);font-weight:500}
.u{font-size:10px;color:var(--ink-mute);display:block;margin-top:1px}
.pct{font-size:12px;font-weight:600}
.pct.hi{color:var(--danger)}
.pct.lo{color:var(--success-fg)}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px}
.badge.ok{background:var(--success-bg);color:var(--success-fg)}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}
.badge.bad{background:var(--danger-bg);color:var(--danger-fg)}
.badge.neu{background:var(--surface-2);color:var(--ink-soft)}
.foot{margin-top:.75rem;font-size:11px;color:var(--ink-mute);line-height:1.6}
.note{background:var(--warn-bg);border:1px solid oklch(76% 0.12 70);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--warn-fg);margin-bottom:.75rem}

/* Cards de resumen */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.25rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card .lbl{font-size:11px;color:var(--ink-soft);margin-bottom:4px}
.card .val{font-size:20px;font-weight:700;color:var(--ink)}
.card .sub{font-size:11px;color:var(--ink-mute);margin-top:2px}
.card.green .val{color:var(--success-fg)}
.card.red .val{color:var(--danger)}
.card.amber .val{color:var(--warn-fg)}

/* Input editable en tabla */
input.cell-input{width:90px;height:28px;padding:0 8px;font-size:12px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--ink);text-align:right}
input.cell-input:focus{outline:none;border-color:var(--brand)}

/* Margen bar */
.mbar{display:flex;align-items:center;gap:6px}
.mbar-track{flex:1;height:6px;background:var(--surface-2);border-radius:3px;min-width:60px}
.mbar-fill{height:6px;border-radius:3px;transition:width .3s}

/* Zonas envio */
/* Tienda */
.store-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:10px}
.store-search{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1}
.store-search input{height:34px;padding:0 12px;font-size:13px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);min-width:180px}
.store-search input:focus{outline:none;border-color:var(--brand)}
.cart-btn-wrap{position:relative;cursor:pointer}
.cart-btn{height:36px;padding:0 16px;font-size:13px;font-weight:600;border:none;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.cart-btn:hover{background:var(--brand-hover)}
.cart-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;display:none}
.store-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:1.5rem;padding-bottom:90px}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.prod-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.prod-icon{width:100%;height:72px;display:flex;align-items:center;justify-content:center;font-size:42px;background:var(--bg);border-radius:8px;position:relative;overflow:hidden}
.prod-icon-photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35;transition:opacity .2s}
.prod-card:hover .prod-icon-photo{opacity:.5}
.prod-icon-emoji{position:relative;z-index:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
/* Tema Lumina: tipografía Apple-like, hovers solo-borde, color únicamente en dots de categoría */
html[data-theme="lumina"] h1{font-weight:600;letter-spacing:-0.025em}
html[data-theme="lumina"] .prod-name,html[data-theme="lumina"] .rec-name,html[data-theme="lumina"] .store-menu-cat-title,html[data-theme="lumina"] .store-banner-name{letter-spacing:-0.015em}
html[data-theme="lumina"] .prod-card{transition:border-color .2s}
html[data-theme="lumina"] .prod-card:hover,html[data-theme="lumina"] .rec-card:hover{box-shadow:none;border-color:oklch(22% 0.005 250 / .3)}
html[data-theme="lumina"] .shortcut:hover{transform:none}
.prod-dot{display:none;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0}
html[data-theme="lumina"] .prod-dot{display:inline-block}
.prod-dot[data-cat="Verduras"]{background:#22C55E}
.prod-dot[data-cat="Frutas"]{background:#F59E0B}
.prod-dot[data-cat="Hongos"]{background:#8B5CF6}
.prod-dot[data-cat="Almacén"]{background:#3B82F6}
.prod-name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}
.prod-unit{font-size:11px;color:var(--ink-mute)}
.prod-price{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-0.01em}
.prod-comp{font-size:10px;color:var(--ink-soft)}
.qty-row{display:flex;align-items:center;gap:6px;margin-top:auto}
.qty-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);flex-shrink:0}
.qty-btn:hover{background:var(--surface-2)}
.qty-num{flex:1;text-align:center;font-size:13px;font-weight:600}
.add-btn{width:100%;height:30px;border:none;border-radius:7px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;cursor:pointer;margin-top:2px}
.add-btn:hover{background:var(--brand-hover)}
.add-btn.added{background:var(--success)}
/* Cart drawer */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9998;display:none}
.cart-overlay.open{display:block}
.cart-drawer{position:fixed;top:0;right:0;width:340px;max-width:100vw;height:100vh;height:100dvh;background:var(--surface);z-index:9999;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;box-shadow:-4px 0 24px rgba(0,0,0,.12);padding-right:env(safe-area-inset-right,0px)}
.cart-drawer.open{transform:translateX(0)}
.cart-head{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;border-bottom:1px solid var(--border);gap:8px}
.cart-head h2{font-size:15px;font-weight:700;flex:1}
.cart-close,.cart-back{width:30px;height:30px;border:none;background:transparent;font-size:18px;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0}
.cart-close{font-size:20px}
.cart-close:hover,.cart-back:hover{background:var(--surface-2);color:var(--ink)}
.cart-items{flex:1;overflow-y:auto;padding:12px 16px}
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--surface-2)}
.cart-item-icon{font-size:24px;width:36px;text-align:center}
.cart-item-info{flex:1}
.cart-item-name{font-size:13px;font-weight:600}
.cart-item-unit{font-size:11px;color:var(--ink-mute)}
.cart-item-price{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.cart-item-qty{display:flex;align-items:center;gap:4px;margin-top:4px}
.cqb{width:22px;height:22px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.cqb:hover{background:var(--surface-2)}
.cq-num{font-size:12px;font-weight:600;min-width:20px;text-align:center}
.cart-empty{text-align:center;padding:2rem;color:var(--ink-faint);font-size:13px}
.cart-foot{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
.cart-subtotal{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--ink-soft)}
.cart-total{display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-bottom:12px}
.cart-zona{margin-bottom:10px}
.cart-zona select{width:100%;height:32px;padding:0 8px;font-size:12px;border:1px solid var(--border-strong);border-radius:7px}
.cart-envio-info{font-size:11px;padding:7px 10px;border-radius:6px;margin-bottom:0;line-height:1.5}
.checkout-btn{width:100%;height:40px;border:none;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.checkout-btn:hover{background:var(--brand-hover)}
/* Cart drawer single-step layout */
.cart-drawer .cart-items{flex:initial;max-height:none;overflow-y:visible;padding:12px 16px 4px}
.cart-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.cart-config{padding:8px 16px 14px;display:flex;flex-direction:column;gap:11px}
.cart-config .cart-subtotal{margin-bottom:0}
.cart-config .cart-zona{margin-bottom:0}
/* Entrega tabs (delivery / pickup) */
.entrega-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:3px;background:var(--surface-2);border-radius:9px}
.entrega-tab{height:34px;border:none;background:transparent;color:var(--ink-soft);font-size:12px;font-weight:600;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .15s,color .15s}
.entrega-tab:hover{color:var(--ink)}
.entrega-tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.entrega-section{display:flex;flex-direction:column;gap:11px}
/* Form fields */
.checkout-field{display:flex;flex-direction:column;gap:5px}
.checkout-field label{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.checkout-field label .req{color:var(--danger);font-weight:700;text-transform:none;letter-spacing:0}
.checkout-field label .opt{color:var(--ink-faint);font-weight:500;text-transform:none;letter-spacing:0;font-size:10px}
.checkout-field input,.checkout-field select{width:100%;height:36px;padding:0 12px;font-size:13px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-family:inherit}
.checkout-field input:focus,.checkout-field select:focus{outline:none;border-color:var(--brand)}
.checkout-field input.invalid,.checkout-field select.invalid{border-color:var(--danger);background:var(--danger-bg)}
.checkout-error{font-size:12px;color:var(--danger-fg);background:var(--danger-bg);padding:8px 11px;border-radius:7px;display:none;line-height:1.5}
.checkout-error.show{display:block}
/* Dirección + GPS button */
.addr-row{display:flex;gap:6px}
.addr-row input{flex:1}
.addr-locate{width:36px;height:36px;flex-shrink:0;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.addr-locate:hover{background:var(--surface-2);border-color:var(--brand)}
/* Mini map toggle */
.map-toggle{align-self:flex-start;height:28px;padding:0 11px;font-size:11px;font-weight:600;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-soft);border-radius:7px;cursor:pointer;margin-top:2px}
.map-toggle:hover{color:var(--ink);border-color:var(--brand)}
.map-toggle.on{background:var(--brand-tint);color:var(--brand);border-color:var(--brand)}
.cart-mini-map-wrap{display:none;flex-direction:column;gap:6px;margin-top:4px}
.cart-mini-map-wrap.show{display:flex}
#cart-mini-map{width:100%;height:160px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);overflow:hidden}
.map-search-btn{align-self:flex-end;height:28px;padding:0 11px;font-size:11px;font-weight:600;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:7px;cursor:pointer}
.map-search-btn:hover{background:var(--brand-tint);border-color:var(--brand);color:var(--brand)}
/* Store layouts (alterna desde el editor de estilo del tenant) */
.store-grid.store-mini{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
@media(max-width:640px){.store-grid.store-mini{grid-template-columns:repeat(3,1fr);gap:6px}}
.store-grid.store-mini .prod-card{padding:8px;gap:5px;border-radius:9px}
.store-grid.store-mini .prod-icon{height:56px;font-size:30px;border-radius:6px}
.store-grid.store-mini .prod-icon-emoji{font-size:30px}
.store-grid.store-mini .prod-name{font-size:11px;line-height:1.2;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.store-grid.store-mini .prod-unit{font-size:9px;color:var(--ink-mute)}
.store-grid.store-mini .prod-price{font-size:13px;font-weight:700;letter-spacing:-0.01em}
.store-grid.store-mini .prod-comp{display:none}
.store-grid.store-mini .qty-row{gap:3px;margin-top:auto}
.store-grid.store-mini .qty-btn{width:22px;height:22px;font-size:12px;border-radius:5px}
.store-grid.store-mini .qty-num{font-size:11px}
.store-grid.store-mini .add-btn{height:28px;font-size:10px;padding:0;font-weight:600;border-radius:6px}
.store-grid.store-list{display:flex;flex-direction:column;gap:8px}
.store-grid.store-list .prod-card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:10px 12px;align-items:center}
.store-grid.store-list .prod-icon{width:56px;height:56px;font-size:28px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center}
.store-grid.store-list .prod-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.store-grid.store-list .prod-name{font-size:13px;font-weight:600}
.store-grid.store-list .prod-unit{font-size:10px;color:var(--ink-mute)}
.store-grid.store-list .prod-comp{font-size:10px;color:var(--ink-soft)}
.store-grid.store-list .prod-price{font-size:14px;font-weight:700;color:var(--ink);grid-column:initial;text-align:right;letter-spacing:-0.01em}
.store-grid.store-list .qty-row{display:none}
.store-grid.store-list .prod-actions{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.store-grid.store-list .add-btn{width:auto;height:30px;padding:0 14px;font-size:11px;margin:0;border-radius:6px}
.store-grid.store-catalog{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.store-grid.store-catalog .prod-card{padding:18px;gap:12px}
.store-grid.store-catalog .prod-icon{height:120px;font-size:64px;border-radius:10px}
.store-grid.store-catalog .prod-name{font-size:15px;font-weight:700}
.store-grid.store-catalog .prod-price{font-size:20px;font-weight:800;letter-spacing:-0.02em}
.store-grid.store-catalog .add-btn{height:36px;font-size:13px}
.store-grid.store-menu{display:block;grid-template-columns:none}
.store-menu-cats{display:flex;flex-direction:column;gap:24px}
.store-menu-cat-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;letter-spacing:-0.01em}
.store-menu-cat-title .count{font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--surface-2);padding:2px 8px;border-radius:999px}
.cat-scroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.cat-scroll .prod-card{flex:0 0 180px;scroll-snap-align:start}
.cat-scroll::-webkit-scrollbar{height:6px}
.cat-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

/* Editor de estilo (admin drawer) */
.style-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:14px}
.style-section-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:8px}
.style-section-head h3{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;margin:0}
.style-section-head .style-toggle{font-size:14px;color:var(--ink-soft);transition:transform .2s}
.style-section.open .style-toggle{transform:rotate(180deg)}
.style-section-body{margin-top:14px;display:none}
.style-section.open .style-section-body{display:block}
.style-sub{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.style-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.style-card{position:relative;border:2px solid var(--border);background:var(--bg);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s,background .15s}
.style-card:hover{border-color:var(--border-strong)}
.style-card.on{border-color:var(--brand);background:var(--brand-tint)}
.style-card .sc-name{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px}
.style-card .sc-desc{font-size:11px;color:var(--ink-soft);line-height:1.4}
.style-card .sc-check{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center}
.style-card.on .sc-check{display:flex}
.swatches-row{display:flex;gap:5px;margin-top:8px}
.swatch{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,0.1);flex-shrink:0}
.layout-mock{width:100%;height:48px;background:var(--surface-2);border-radius:6px;margin-top:8px;display:flex;padding:5px;gap:3px}
.layout-mock--grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.layout-mock--mini{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.layout-mock--mini .lm-block{height:10px}
.layout-mock--list{flex-direction:column;gap:3px}
.layout-mock--catalog{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.layout-mock--menu{flex-direction:column;gap:3px}
.layout-mock .lm-block{background:var(--brand);opacity:0.4;border-radius:3px;min-height:6px}
.layout-mock--grid .lm-block{height:18px}
.layout-mock--list .lm-block{height:8px}
.layout-mock--catalog .lm-block{height:18px}
.layout-mock--menu .lm-row{display:flex;gap:3px;align-items:center}
.layout-mock--menu .lm-row::before{content:"";width:18px;height:3px;background:var(--ink-soft);opacity:0.3;border-radius:2px}
.layout-mock--menu .lm-row .lm-block{flex:1;height:10px}

/* Combos en el listado de la tienda */
.combo-card{border:1.5px solid var(--brand)}
.combo-badge{position:absolute;top:8px;left:8px;background:var(--brand);color:#fff;font-size:9px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.04em;z-index:2}
.combo-tachado{font-size:11px;color:var(--ink-faint);text-decoration:line-through;font-weight:500;margin-left:4px}
.combo-items{line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.store-grid.store-mini .combo-card .combo-items{display:none}
.store-grid.store-mini .combo-card .combo-tachado{display:none}
/* Product view modal (detalle cliente) */
.store-grid .prod-icon{cursor:pointer}
.prod-view-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998;display:none}
.prod-view-overlay.open{display:block}
.prod-view-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(400px,92vw);max-height:min(680px,90dvh);background:var(--surface);border:1px solid var(--border);border-radius:16px;z-index:9999;display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.prod-view-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#prod-view-content{display:flex;flex-direction:column;overflow-y:auto}
.pv-photo{width:100%;height:210px;flex-shrink:0;background-color:var(--bg);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;position:relative}
.pv-emoji{font-size:84px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.pv-collage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px}
.pv-collage>div{background-size:cover;background-position:center}
.pv-collage-emoji{position:relative;z-index:1;font-size:56px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.pv-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border:none;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.pv-close:hover{background:rgba(0,0,0,.65)}
.pv-stock-tag{position:absolute;bottom:10px;left:10px;font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em}
.pv-body{padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.pv-name{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-0.015em;display:flex;align-items:center}
.pv-meta{font-size:12px;color:var(--ink-soft)}
.pv-price{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-0.02em;margin-top:2px}
.pv-comp{font-size:12px;color:var(--ink-soft)}
.pv-temp{font-size:11px;color:var(--ink-mute);line-height:1.5;padding:8px 11px;background:var(--bg);border-radius:8px;margin-top:4px}
.pv-actions{display:flex;gap:10px;align-items:center;margin-top:10px}
.pv-actions .qty-row{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.pv-actions .qty-btn{width:32px;height:32px;font-size:16px}
.pv-actions .qty-num{min-width:28px;text-align:center;font-size:14px;font-weight:700}
.pv-actions .add-btn{flex:1;height:40px;font-size:13px;margin:0}
/* Product editor drawer */
.prod-edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998;display:none}
.prod-edit-overlay.open{display:block}
.prod-edit-drawer{position:fixed;top:0;right:0;width:min(440px,100vw);height:100vh;height:100dvh;background:var(--bg);z-index:9999;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;box-shadow:-6px 0 30px rgba(0,0,0,.18);padding-right:env(safe-area-inset-right,0px)}
.prod-edit-drawer.open{transform:translateX(0)}
.prod-edit-head{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;background:var(--brand);color:#fff;gap:8px}
.prod-edit-head h2{font-size:15px;font-weight:700;flex:1;letter-spacing:-0.01em}
.prod-edit-head .cart-close{color:#fff;background:rgba(255,255,255,.15)}
.prod-edit-head .cart-close:hover{background:rgba(255,255,255,.25)}
.prod-edit-body{flex:1;overflow-y:auto;padding:16px}
.prod-edit-preview{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px}
.prod-edit-preview .prod-icon{width:84px;height:84px;flex-shrink:0;font-size:48px}
.prod-edit-preview .prod-icon-emoji{font-size:48px}
.prod-edit-preview .pep-info{flex:1;min-width:0}
.prod-edit-preview .pep-info strong{display:block;font-size:14px;color:var(--ink);font-weight:700;margin-bottom:2px}
.prod-edit-preview .pep-info span{font-size:11px;color:var(--ink-soft)}
.pe-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.pe-field label{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.pe-field input,.pe-field select,.pe-field textarea{width:100%;height:36px;padding:0 12px;font-size:13px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-family:inherit}
.pe-field input:focus,.pe-field select:focus,.pe-field textarea:focus{outline:none;border-color:var(--brand)}
.pe-field .pe-hint{font-size:10px;color:var(--ink-mute);line-height:1.4;margin-top:2px}
.pe-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pe-foot{display:flex;gap:8px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);background:var(--surface)}
.pe-foot button{flex:1;height:40px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink)}
.pe-foot button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.pe-foot button.primary:hover{background:var(--brand-hover)}
.pe-foot button:not(.primary):hover{background:var(--bg)}
/* Banner local cerrado en tienda */
.store-blocked-banner{display:flex;flex-direction:column;gap:4px;background:var(--warn-bg);border:1px solid var(--warn);border-radius:10px;padding:12px 16px;margin-bottom:1rem}
.store-blocked-banner strong{font-size:14px;color:var(--warn-fg);font-weight:700}
.store-blocked-banner span{font-size:12px;color:var(--warn-fg);line-height:1.5}
.store-blocked-banner em{font-style:normal;font-weight:600}
/* Warning en config */
.entrega-warning{margin-top:12px;padding:10px 12px;background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn);border-radius:8px;font-size:12px;line-height:1.5}
/* Toggle local activo en dashboard */
.local-status{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px}
.local-status.inactivo{background:var(--warn-bg);border-color:var(--warn)}
.local-status-info{flex:1;display:flex;flex-direction:column;gap:2px}
.local-status-info strong{font-size:13px;font-weight:700;color:var(--ink)}
.local-status.inactivo .local-status-info strong{color:var(--warn-fg)}
.local-status-info span{font-size:11px;color:var(--ink-soft);line-height:1.5}
.local-status.inactivo .local-status-info span{color:var(--warn-fg)}
/* Toggles de opciones de entrega (admin) */
.entrega-config{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.entrega-config-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px}
.entrega-config-desc{font-size:11px;color:var(--ink-soft);line-height:1.55;margin-bottom:12px}
.entrega-config-rows{display:flex;flex-direction:column;gap:8px}
.entrega-toggle{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:9px;cursor:pointer;transition:border-color .15s}
.entrega-toggle:hover{border-color:var(--border-strong)}
.entrega-toggle .et-info{flex:1;display:flex;flex-direction:column;gap:2px}
.entrega-toggle .et-info strong{font-size:13px;font-weight:600;color:var(--ink)}
.entrega-toggle .et-info span{font-size:11px;color:var(--ink-soft);line-height:1.4}
.entrega-toggle input[type=checkbox]{position:absolute;opacity:0;pointer-events:none}
.entrega-toggle .et-switch{width:38px;height:22px;background:var(--surface-2);border-radius:999px;position:relative;transition:background .2s;flex-shrink:0}
.entrega-toggle .et-switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--surface);border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.entrega-toggle input:checked + .et-switch{background:var(--brand)}
.entrega-toggle input:checked + .et-switch::after{transform:translateX(16px)}

/* Pickup info */
.pickup-info{padding:12px 14px;background:var(--brand-tint);border:1px solid var(--brand);border-radius:9px;font-size:12px;line-height:1.6;color:var(--ink)}
.pickup-info strong{color:var(--brand);font-weight:700;display:block;font-size:13px;margin-bottom:4px}
.pickup-info .pi-row{display:flex;gap:6px;color:var(--ink-soft);font-size:12px}
.pickup-info .pi-row span{font-weight:600;color:var(--ink)}
/* Sticky bottom cart bar */
.cart-bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(140% + env(safe-area-inset-bottom,0px)));width:min(680px,calc(100vw - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:90;transition:transform .28s cubic-bezier(.2,.8,.2,1);flex-wrap:wrap}
.cart-bar.show{transform:translate(-50%,0)}
.cart-bar-info{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.cart-bar-icon{font-size:24px;flex-shrink:0}
.cart-bar-text{display:flex;flex-direction:column;min-width:0}
.cart-bar-count{font-size:13px;font-weight:700;line-height:1.2}
.cart-bar-preview{font-size:13px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;letter-spacing:1px}
.cart-bar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cart-bar-detail{background:transparent;border:none;color:rgba(255,255,255,.75);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:6px 4px;white-space:nowrap}
.cart-bar-detail:hover{color:#fff}
.cart-bar-cta{display:flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.cart-bar-cta:hover{background:var(--brand-hover)}
.cart-bar-cta-arrow{font-size:15px}
@media(max-width:560px){
  .cart-bar{bottom:10px;padding:10px 12px}
  .cart-bar-preview{display:none}
  .cart-bar-detail{display:none}
}
/* Recetas */
.rec-header{margin-bottom:1rem}
.rec-header h2{font-size:15px;font-weight:700;margin-bottom:4px}
.rec-header p{font-size:12px;color:var(--ink-soft)}
.rec-header--with-cart{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rec-header--with-cart .rec-header-text{flex:1;min-width:240px}
.rec-header--with-cart .cart-btn-wrap{flex-shrink:0}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:1.5rem}
.rec-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:6px}
.rec-card:hover{border-color:var(--brand);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.rec-card.sel{border-color:var(--brand);background:var(--brand-tint)}
/* Card expandida in-place: ocupa toda la fila y muestra el detalle adentro */
.rec-card.expanded{
  grid-column:1 / -1;
  cursor:default;
  background:var(--surface);
  border-color:var(--brand);
  border-width:2px;
  padding:20px;
  gap:0;
  animation:recExpand .25s ease-out;
  position:relative;
  box-shadow:0 6px 24px rgba(0,0,0,.10);
}
.rec-card.expanded:hover{box-shadow:0 6px 24px rgba(0,0,0,.10)}
@keyframes recExpand{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.rec-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border:none;background:var(--surface-2);color:var(--ink-soft);font-size:14px;cursor:pointer;border-radius:7px;display:flex;align-items:center;justify-content:center;z-index:2;transition:all .15s}
.rec-close:hover{background:var(--danger-bg);color:var(--danger)}
.rec-emoji{font-size:36px;line-height:1}
.rec-name{font-size:14px;font-weight:700;color:var(--ink)}
.rec-desc{font-size:11px;color:var(--ink-soft);line-height:1.4;flex:1}
.rec-meta{display:flex;gap:8px;font-size:10px;color:var(--ink-soft);margin-top:4px;flex-wrap:wrap}
.rec-tag{background:var(--surface-2);padding:2px 7px;border-radius:4px;font-weight:500}
.rec-tag.veg{background:var(--success-bg);color:var(--success-fg)}
.rec-tag.time{background:var(--info-bg);color:var(--info)}
.rec-tag.diff{background:var(--warn-bg);color:var(--warn-fg)}

/* Receta detail */
.rec-detail{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:1rem}
.rec-detail-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.rec-detail-emoji{font-size:48px;line-height:1}
.rec-detail-info{flex:1;min-width:200px}
.rec-detail-info h3{font-size:18px;font-weight:700;margin-bottom:4px}
.rec-detail-info p{font-size:12px;color:var(--ink-soft);line-height:1.5}
.rec-personas{display:flex;align-items:center;gap:8px;background:var(--bg);padding:8px 12px;border-radius:9px}
.rec-personas-lbl{font-size:11px;color:var(--ink-soft);font-weight:600}
.rec-personas-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);font-size:14px;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center}
.rec-personas-btn:hover{background:var(--surface-2)}
.rec-personas-num{font-size:16px;font-weight:700;min-width:24px;text-align:center}

.rec-ingredientes{margin-top:14px}
.rec-ing-title{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.rec-ing-list{display:flex;flex-direction:column;gap:6px}
.rec-ing-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rec-ing-row.miss{background:var(--danger-bg);border:1px dashed oklch(85% 0.05 25)}
.rec-ing-icon{font-size:18px;width:24px;text-align:center}
.rec-ing-info{flex:1}
.rec-ing-name{font-size:12px;font-weight:600;color:var(--ink)}
.rec-ing-cant{font-size:11px;color:var(--ink-soft)}
.rec-ing-price{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.rec-ing-miss{font-size:11px;color:var(--danger);font-style:italic}
.rec-summary{margin-top:14px;padding:12px;background:var(--success-bg);border-radius:9px;border:1px solid var(--success-bg)}
.rec-summary-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.rec-summary-row.total{font-size:15px;font-weight:700;margin-top:6px;padding-top:6px;border-top:1px solid var(--success-bg);margin-bottom:0}
.rec-add-btn{width:100%;height:40px;border:none;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
.rec-add-btn:hover{background:var(--brand-hover)}
.rec-add-btn:disabled{background:var(--ink-faint);cursor:not-allowed;opacity:0.7}
.rec-prep{margin-top:14px;padding:12px;background:var(--warn-bg);border-radius:9px;border:1px solid oklch(76% 0.12 70)}
.rec-prep h4{font-size:12px;font-weight:700;color:var(--warn-fg);margin-bottom:6px}
.rec-prep ol{padding-left:18px;font-size:12px;color:var(--warn-fg);line-height:1.7}
.rec-prep li{margin-bottom:3px}
/* Ubicacion */
.ubi-grid{display:grid;grid-template-columns:1fr 360px;gap:16px;margin-bottom:1rem}
@media(max-width:900px){.ubi-grid{grid-template-columns:1fr}}
#map-container{width:100%;height:520px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2)}
.map-wrap{position:relative}
.map-style-picker{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:4px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);padding:4px;border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.15);flex-wrap:wrap;max-width:calc(100% - 20px)}
.map-style-btn{font-size:11px;font-weight:600;padding:5px 10px;border:none;border-radius:6px;background:transparent;color:#555;cursor:pointer;white-space:nowrap;transition:all .12s}
.map-style-btn:hover{background:rgba(0,0,0,.06)}
.map-style-btn.on{background:#1a6630;color:#fff}
.ubi-side{display:flex;flex-direction:column;gap:12px}
.ubi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.ubi-card h3{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--ink);display:flex;align-items:center;gap:6px}
.ubi-input-row{display:flex;gap:6px;margin-bottom:8px}
.ubi-input-row input{flex:1;height:34px;padding:0 12px;font-size:13px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.ubi-input-row input:focus{outline:none;border-color:var(--brand)}
.ubi-btn{height:34px;padding:0 14px;font-size:12px;font-weight:600;border:none;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer;white-space:nowrap}
.ubi-btn:hover{background:var(--brand-hover)}
.ubi-btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong)}
.ubi-btn.alt:hover{background:var(--surface-2)}
.ubi-current{padding:10px 12px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.6}
.ubi-current strong{color:var(--ink)}
.tienda-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto}
.tienda-row{padding:11px 12px;background:var(--surface);border:1.5px solid var(--border);border-radius:9px;cursor:pointer;transition:all .15s}
.tienda-row:hover{border-color:var(--brand);background:var(--surface-2)}
.tienda-row.sel{border-color:var(--brand);background:var(--brand-tint);border-width:1.5px}
.tienda-row.closest{position:relative}
.tienda-row.is-mia{border-color:var(--brand);background:var(--brand-tint)}
.tienda-row.is-mia:hover{background:var(--success-bg)}
.mia-badge{background:var(--brand);color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:auto;letter-spacing:.04em}
.closest-badge{position:absolute;top:-7px;right:8px;background:var(--brand);color:#fff;font-size:9px;font-weight:700;padding:2px 9px;border-radius:999px}
.tienda-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.tienda-color{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.tienda-name{font-size:13px;font-weight:700;color:var(--ink);flex:1}
.tienda-dist{font-size:11px;font-weight:700;color:var(--success-fg);background:var(--success-bg);padding:2px 9px;border-radius:999px}
.tienda-addr{font-size:11px;color:var(--ink-soft);margin-bottom:4px;line-height:1.4}
.tienda-meta{font-size:11px;color:var(--ink-soft)}
.tienda-tiempo{display:inline-block;font-size:10px;color:var(--ink-soft);background:var(--surface-2);padding:1px 6px;border-radius:4px;margin-right:4px}
.tienda-empty{padding:20px;text-align:center;color:var(--ink-faint);font-size:12px}
/* Leaflet custom marker */
.user-marker{background:transparent!important;border:none!important}
.tienda-marker{background:transparent!important;border:none!important}
.leaflet-marker-icon.tienda-marker,.leaflet-marker-icon.user-marker{background:transparent!important;border:none!important;box-shadow:none!important}
.leaflet-div-icon{background:transparent!important;border:none!important}
.leaflet-marker-shadow{display:none!important}
.leaflet-popup-content{font-family:system-ui,sans-serif;margin:10px 12px;font-size:12px;line-height:1.5}
.leaflet-popup-content b{display:block;font-size:13px;margin-bottom:3px}
/* Stock */
.stock-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:1rem;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.stock-toolbar input[type=text]{flex:1;min-width:160px;height:34px;padding:0 10px;font-size:13px;border:1px solid var(--border-strong);border-radius:7px}
.stock-toolbar button{height:34px;padding:0 14px;font-size:12px;font-weight:600;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;color:var(--ink)}
.stock-toolbar button:hover{background:var(--surface-2)}
.stock-toolbar button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.stock-toolbar button.primary:hover{background:var(--brand-hover)}
.stock-toolbar button.danger{color:var(--danger);border-color:oklch(85% 0.05 25)}
.stock-toolbar button.danger:hover{background:var(--danger-bg)}
.bulk-update{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-soft);padding:6px 10px;background:var(--warn-bg);border-radius:6px;border:1px solid oklch(76% 0.12 70)}
.bulk-update input{height:28px;padding:0 8px;font-size:12px;border:1px solid var(--border-strong);border-radius:5px;width:70px}
.stock-table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}
.stock-table th{background:var(--surface-2);padding:8px 10px;font-weight:600;font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--border);white-space:nowrap;text-align:center;cursor:pointer;user-select:none}
.stock-table th:first-child{text-align:left;width:50px}
.stock-table th.namec{text-align:left;width:auto}
.stock-table th.sortable:hover{background:var(--surface-3);color:var(--ink)}
.stock-table td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--surface-2);vertical-align:middle}
.stock-table td:first-child{text-align:center}
.stock-table td.name-td{text-align:left}
.stock-row:hover td{background:var(--surface-2)}
.stock-row.disabled td{opacity:.45}
.stock-row.disabled td.name-td .stock-name{text-decoration:line-through}
.stock-check{width:16px;height:16px;cursor:pointer;accent-color:var(--success-fg)}
.stock-emoji{font-size:18px;margin-right:4px}
.stock-name{font-size:12px;font-weight:600;color:var(--ink)}
.stock-unit{font-size:10px;color:var(--ink-mute);display:block}
.stock-input{width:80px;height:28px;padding:0 8px;font-size:12px;border:1px solid var(--border-strong);border-radius:6px;text-align:right;background:var(--surface);color:var(--ink)}
.stock-input:focus{outline:none;border-color:var(--brand)}
.stock-input.qty{width:60px}
.stock-input.changed{background:var(--warn-bg);border-color:oklch(76% 0.12 70)}
.stock-status{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.stock-status.ok{background:var(--success-bg);color:var(--success-fg)}
.stock-status.low{background:var(--warn-bg);color:var(--warn-fg)}
.stock-status.out{background:var(--danger-bg);color:var(--danger-fg)}
.stock-status.off{background:var(--surface-2);color:var(--ink-soft)}
.stock-margen-mini{font-size:11px;font-weight:700}
.stock-margen-mini.good{color:var(--success-fg)}
.stock-margen-mini.warn{color:var(--warn-fg)}
.stock-margen-mini.bad{color:var(--danger)}
.stock-actions{display:flex;gap:4px;justify-content:center}
.stock-act-btn{width:24px;height:24px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.stock-act-btn:hover{background:var(--surface-2)}
.summary-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1rem}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 12px;text-align:center}
.summary-card .lbl{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.summary-card .val{font-size:18px;font-weight:700}
.summary-card.ok .val{color:var(--success-fg)}
.summary-card.warn .val{color:var(--warn-fg)}
.summary-card.bad .val{color:var(--danger)}
/* Dashboard */
.dash-headline{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:760px){.dash-headline{grid-template-columns:1.6fr 1fr 1fr}}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:1.25rem}
.dash-kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative}
.dash-kpi-lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.dash-kpi-lbl::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex-shrink:0}
.dash-kpi.accent-green .dash-kpi-lbl::before{background:var(--success)}
.dash-kpi.accent-blue .dash-kpi-lbl::before{background:var(--info)}
.dash-kpi.accent-amber .dash-kpi-lbl::before{background:var(--warn)}
.dash-kpi.accent-red .dash-kpi-lbl::before{background:var(--danger)}
.dash-kpi.accent-purple .dash-kpi-lbl::before{background:var(--accent-purple)}
.dash-kpi-val{font-size:22px;font-weight:700;color:var(--ink);line-height:1.1;letter-spacing:-0.01em}
.dash-kpi-sub{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.4}
.dash-kpi--lead{padding:20px 22px;background:var(--surface);border:1px solid var(--border)}
.dash-kpi--lead .dash-kpi-val{font-size:36px;font-weight:800;letter-spacing:-0.02em}
.dash-kpi--lead .dash-kpi-sub{font-size:12px;margin-top:8px}
.dash-trend{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.dash-trend.up{background:var(--success-bg);color:var(--success-fg)}
.dash-trend.down{background:var(--danger-bg);color:var(--danger-fg)}
.dash-row{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:1.5rem}
@media(max-width:900px){.dash-row{grid-template-columns:1fr}}
.dash-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.dash-block h3{font-size:13px;font-weight:700;margin-bottom:14px;color:var(--ink);display:flex;align-items:center;justify-content:space-between}
.dash-block h3 .tag{font-size:10px;font-weight:600;color:var(--ink-soft);background:var(--surface-2);padding:3px 9px;border-radius:999px}
/* Bar chart simple */
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:110px 1fr 60px;align-items:center;gap:10px;font-size:12px}
.bar-name{color:var(--ink-soft);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:18px;background:var(--bg);border-radius:5px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:5px;transition:width .4s}
.bar-val{text-align:right;font-weight:700;color:var(--ink)}
/* Donut */
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.donut-svg{width:140px;height:140px;flex-shrink:0}
.donut-legend{display:flex;flex-direction:column;gap:5px;font-size:11px}
.donut-leg-row{display:flex;align-items:center;gap:6px}
.donut-leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.donut-leg-val{font-weight:700;margin-left:4px}
/* Alert list */
.alert-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;font-size:11px;line-height:1.4;background:var(--surface-2)}
.alert-item.crit{background:var(--danger-bg)}
.alert-item.warn{background:var(--warn-bg)}
.alert-item.info{background:var(--info-bg)}
.alert-icon{font-size:14px;flex-shrink:0}
.alert-body{flex:1}
.alert-title{font-weight:600;color:var(--ink);font-size:11px}
.alert-meta{font-size:10px;color:var(--ink-soft);margin-top:2px}
.dash-table-mini{width:100%;font-size:11px}
.dash-table-mini th{text-align:left;padding:6px 8px;font-weight:600;color:var(--ink-soft);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.dash-table-mini th:not(:first-child){text-align:right}
.dash-table-mini td{padding:6px 8px;border-bottom:1px solid var(--bg)}
.dash-table-mini td:not(:first-child){text-align:right;font-weight:600}
.dash-table-mini tr:hover td{background:var(--surface-2)}

/* Hero verdulería - flat, sober */
.verdu-hero{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);color:var(--ink);border-radius:12px;padding:16px 20px;margin-bottom:1.25rem;flex-wrap:wrap}
.verdu-hero-icon{font-size:34px;line-height:1;flex-shrink:0;width:60px;height:60px;display:flex;align-items:center;justify-content:center;background:var(--brand-tint);border-radius:14px}
.verdu-hero-info{flex:1;min-width:240px}
.verdu-hero-info h2{font-size:20px;font-weight:700;margin-bottom:4px;color:var(--ink);letter-spacing:-0.01em}
.verdu-hero-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-bottom:0}
.verdu-hero-since{font-size:11px;color:var(--ink-faint);margin-top:4px}
.verdu-hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.verdu-hero-actions .form-btn{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong)}
.verdu-hero-actions .form-btn:hover{background:var(--bg);border-color:var(--brand)}
/* Shortcuts */
.shortcuts{display:flex;flex-direction:column;gap:8px}
.shortcut{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg);border-radius:9px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.shortcut:hover{background:var(--surface);border-color:var(--brand);transform:translateX(2px)}
.sc-icon{font-size:22px;line-height:1;flex-shrink:0}
.sc-text{flex:1;display:flex;flex-direction:column}
.sc-text strong{font-size:12px;color:var(--ink);font-weight:700}
.sc-text span{font-size:11px;color:var(--ink-soft)}
.sc-arrow{color:var(--ink-soft);font-size:16px;font-weight:600}
.shortcut:hover .sc-arrow{color:var(--brand)}

/* Admin tab */
.admin-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:1.5rem;flex-wrap:wrap}
.admin-current{background:var(--brand);color:#fff;padding:12px 16px;border-radius:10px;font-size:12px;flex:1;min-width:240px}
.admin-current strong{font-size:14px;display:block;margin-bottom:2px}
.admin-current .meta{color:var(--ink-mute);font-size:11px}
.admin-tenants{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:1.5rem}
.tenant-card{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .15s;position:relative}
.tenant-card:hover{border-color:var(--brand)}
.tenant-card.active{border-color:var(--brand);background:var(--brand-tint)}
.tenant-card.active::after{content:"● Activa";position:absolute;top:10px;right:12px;font-size:10px;font-weight:700;color:var(--success-fg)}
.tenant-icon{font-size:32px;margin-bottom:6px}
.tenant-name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px}
.tenant-zone{font-size:11px;color:var(--ink-soft);margin-bottom:8px}

// ─── HELPERS ─────────────────────────────────────────────
function fmt(v){return v!=null?"$"+Math.round(v).toLocaleString("es-AR"):null}
function pct(v){return v!=null?Math.round(v)+"%":null}
function margen(costo,venta){
  if(!costo||!venta||venta<=0)return null;
  return ((venta-costo)/venta)*100;
}
function markup(costo,venta){
  if(!costo||!venta||costo<=0)return null;
  return ((venta-costo)/costo)*100;
}
function precioSugerido(costo,margenPct){
  if(!costo)return null;
  return Math.round(costo/(1-margenPct/100));
}
function stats(p){
  const def=p.filter(x=>x!==null);
  if(!def.length)return{mn:null,mx:null,avg:null,spread:null,avglo:null,avghi:null};
  const mn=Math.min(...def),mx=Math.max(...def);
  const avg=def.reduce((a,b)=>a+b,0)/def.length;
  const spread=def.length>1?Math.round((mx-mn)/mn*100):null;
  const avglo=def.length>1?Math.round((avg-mn)/mn*100):null;
  const avghi=def.length>1?Math.round((mx-avg)/avg*100):null;
  return{mn,mx,avg,spread,avglo,avghi};
}

function buildFilters(containerId, tid, renderFn){
  const c=document.getElementById(containerId);
  if(c.dataset.built)return;
  c.dataset.built="1";
  CATS.forEach(cat=>{
    const b=document.createElement("button");
    b.className="fb"+(cat==="Todas"?" on":"");
    b.textContent=cat;
    b.dataset.cat=cat;
    b.onclick=()=>{
      c.querySelectorAll(".fb").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      renderFn();
    };
    c.appendChild(b);
  });
}

function getActiveCat(containerId){
  const el=document.querySelector(`#${containerId} .fb.on`);
  return el?el.dataset.cat:"Todas";
}

function getSearch(inputId){
  const el=document.getElementById(inputId);
  return el?el.value.toLowerCase():"";
}

function filteredData(containerId,inputId){
  const cat=getActiveCat(containerId);
  const sv=getSearch(inputId);
  return getMenu().filter(r=>(cat==="Todas"||r.c===cat)&&(!sv||r.n.toLowerCase().includes(sv)));
}

function makeSortableTh(th, tid, col, renderFn){
  th.classList.add("sortable");
  const span=document.createElement("span");
  span.className="arr";
  th.appendChild(span);
  th.onclick=()=>{
    const s=getSortState(tid);
    if(s.col===col){if(s.dir===1)s.dir=-1;else{s.col=null;s.dir=1;}}
    else{s.col=col;s.dir=1;}
    document.querySelectorAll(`[data-sort-tid="${tid}"]`).forEach(t=>t.classList.remove("asc","desc"));
    if(s.col!==null)th.classList.add(s.dir===1?"asc":"desc");
    renderFn();
  };
  th.dataset.sortTid=tid;
  th.dataset.sortCol=col;
}

function applySort(rows, tid, getValue){
  const s=getSortState(tid);
  if(s.col===null)return rows;
  return [...rows].sort((a,b)=>{
    let va=getValue(a,s.col), vb=getValue(b,s.col);
    if(va==null&&vb==null)return 0;
    if(va==null)return 1;
    if(vb==null)return -1;
    return(va-vb)*s.dir;
  });
}
