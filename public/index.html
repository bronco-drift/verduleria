          <th data-sort-tid="sug" data-sort-col="compMin">Comp. mínimo</th>
          <th data-sort-tid="sug" data-sort-col="compMax">Comp. máximo</th>
          <th data-sort-tid="sug" data-sort-col="posicion">Posición</th>
        </tr></thead>
        <tbody id="tb-sug"></tbody>
      </table></div>
      <p class="foot">Posición: comparación de tu precio actual vs la competencia. Verde = sos el más barato, rojo = sos el más caro, amarillo = estás en rango.</p>`;
    p.dataset.init="1";
    buildFilters("fcat-sug","sug",renderSugeridosTable);
    p.querySelectorAll("th[data-sort-col]").forEach(th=>makeSortableTh(th,"sug",th.dataset.sortCol,renderSugeridosTable));
  }

function renderSugeridosTable(){
  let rows=filteredData("fcat-sug","srch-sug");
  const s=getSortState("sug");
  rows=applySort(rows,"sug",(r,col)=>{
    const c=costos[r.n]||0,v=pVentas[r.n]||0;
    const st=stats(r.p);
    if(col==="costo")return c;if(col==="actual")return v;
    if(col==="sugerido")return precioSugerido(c,margenObj);
    if(col==="compMin")return st.mn;if(col==="compMax")return st.mx;
    if(col==="posicion")return v;return null;
  });
  // update header
  const thSug=document.querySelector('[data-sort-tid="sug"][data-sort-col="sugerido"]');
  if(thSug)thSug.childNodes[0].textContent=`Precio sugerido (${margenObj}%)`;

  let lc=null,h="";
  rows.forEach(r=>{
    if(s.col===null&&r.c!==lc){h+=`<tr class="cr"><td colspan="7">${r.c}</td></tr>`;lc=r.c;}
    const c=costos[r.n]||0,v=pVentas[r.n]||0;
    const sug=precioSugerido(c,margenObj);
    const st=stats(r.p);
    let posHTML="<span class='badge neu'>Sin datos</span>";
    if(st.mn!=null&&v>0){
      if(v<=st.mn)posHTML=`<span class='badge ok'>Más barato</span>`;
      else if(v>=st.mx)posHTML=`<span class='badge bad'>Más caro</span>`;
      else posHTML=`<span class='badge warn'>En rango</span>`;
    }
    const difSug=sug&&v?Math.round(((v-sug)/sug)*100):null;
    const difColor=difSug==null?"var(--ink-soft)":difSug>0?"var(--success-fg)":"var(--danger)";
    h+=`<tr>
      <td>${r.n}<span class="u">${r.u}</span></td>
      <td>${fmt(c)}</td>
      <td><span style="font-weight:600">${fmt(v)}</span>${difSug!=null?`<span class="u" style="color:${difColor}">${difSug>0?"+":""}${difSug}% vs sugerido</span>`:""}</td>
      <td class="grp"><span class="p b">${fmt(sug)}</span></td>
      <td>${st.mn?fmt(st.mn):`<span class="p n">—</span>`}</td>
      <td>${st.mx?fmt(st.mx):`<span class="p n">—</span>`}</td>
      <td>${posHTML}</td>
    </tr>`;
  });
  document.getElementById("tb-sug").innerHTML=h||`<tr><td colspan="7" style="text-align:center;padding:1.5rem;color:var(--ink-faint)">Sin resultados</td></tr>`;
}

function diasSinActualizar(fecha){
  const d=new Date(fecha),hoy=new Date();
  return Math.floor((hoy-d)/(1000*60*60*24));
}

  let rows=filteredData("fcat-prov","srch-prov");

    if(col==="costo")return costos[r.n]||0;
    if(col==="fecha")return ultimaActualizacion[r.n]||"";
    if(col==="dias")return diasSinActualizar(ultimaActualizacion[r.n]||"2020-01-01");
    return null;

  let lc=null,h="";
  rows.forEach(r=>{

        ${p.cliente?`<div class="pedido-cliente">
          <div class="pedido-cliente-title">👤 Cliente · ${tipoEmoji} ${tipoLabel}</div>

function togglePedido(id){
  if(pedidosOpen.has(id))pedidosOpen.delete(id);
  else pedidosOpen.add(id);
  renderPedidosList();
}

function cambiarEstadoPedido(id,nuevoEstado){
  const p=pedidos.find(x=>x.id===id);
  if(!p)return;
  p.estado=nuevoEstado;
  if(nuevoEstado==="preparando")asignarRiderAuto(p);
  saveToLocalStorage();
  renderPedidosSummary();
  renderPedidosList();
  if(typeof refreshMisPedidosSiVisible==="function")refreshMisPedidosSiVisible();

// Al pasar a "Preparando", los pedidos delivery de locales con flota IZIFUD se
// asignan al rider en línea con menos entregas activas. Si no hay nadie en
// línea, quedan en la cola "Sin asignar" del panel de riders.
function asignarRiderAuto(p){
  if(p.tipoEntrega==="pickup"||p.riderId)return;
  const t=tenants[currentTenantId];
  if(getEntregaConfig(t).riderPlataforma===false)return;
  const enLinea=riders.filter(r=>r.activo&&r.enLinea);
  if(!enLinea.length)return;
  const carga=id=>allPedidosCrossTenant().filter(x=>x.p.riderId===id&&(x.p.estado==="preparando"||x.p.estado==="en_camino")).length;
  const elegido=enLinea.slice().sort((a,b)=>carga(a.id)-carga(b.id))[0];
  p.riderId=elegido.id;
}

function cancelarPedido(id){
  if(!confirm("¿Cancelar este pedido?"))return;
  cambiarEstadoPedido(id,"cancelado");
}

function eliminarPedido(id){
  if(!confirm("¿Eliminar este pedido del historial?\n\nEsta acción no se puede deshacer."))return;
  pedidos=pedidos.filter(p=>p.id!==id);
  pedidosOpen.delete(id);
  saveToLocalStorage();
  renderPedidosSummary();
  renderPedidosList();
}

function ventasPorProducto(){
  const acc={};
  (pedidos||[]).forEach(p=>{
    if(p.estado==="cancelado")return;
    (p.items||[]).forEach(i=>{acc[i.nombre]=(acc[i.nombre]||0)+i.qty;});
  });
  return acc;
}

function popScore(nombre,ventas){
  return (POPULARIDAD_BASE[nombre]||0)+((ventas&&ventas[nombre])||0)*5;
}

// Combos armados de tienda: en IZIFUD los combos son categoría de la carta
// de cada restaurante, así que esta lista queda vacía.
const COMBOS_TIENDA=[];

function comboInfo(combo){
  let bruto=0,disponible=true;
  combo.items.forEach(i=>{
    const s=stockState[i.n];
    if(!s||!s.activo||s.stock<i.qty)disponible=false;
    bruto+=(pVentas[i.n]||0)*i.qty;
  });
  const final=Math.round(bruto*(1-combo.descuento/100));
  return {bruto,final,ahorro:bruto-final,disponible};
}

function agregarComboTienda(id){
  const combo=COMBOS_TIENDA.find(c=>c.id===id);
  if(!combo)return;
  const info=comboInfo(combo);
  if(!info.disponible){alert("Algunos productos del combo no están disponibles ahora.");return;}
  combo.items.forEach(i=>{cart[i.n]=(cart[i.n]||0)+i.qty;});
  updateCartBadge();
  if(typeof updateCartBar==="function")updateCartBar();
  renderStoreGrid();
}

function renderStoreGrid(){
  const grid=document.getElementById("store-grid");
  if(!grid)return;
  let rows=getMenu().filter(r=>{
    if(storeActiveCat!=="Todas"&&r.c!==storeActiveCat)return false;
    if(storeSearch&&!r.n.toLowerCase().includes(storeSearch))return false;
    if(stockState&&stockState[r.n]&&!stockState[r.n].activo)return false;
    return true;
  });
  const style=getTenantStyle(tenants[currentTenantId]);
  const layout=style.layout||"grilla";
  const orden=style.ordenCatalogo||"popularidad";
  const sinStockAlFinal=style.sinStockAlFinal!==false;
  const conCombos=style.mostrarCombos!==false&&storeActiveCat==="Todas"&&!storeSearch;

  // Orden del catálogo
  if(orden==="popularidad"){
    const ventas=ventasPorProducto();
    rows.sort((a,b)=>popScore(b.n,ventas)-popScore(a.n,ventas)||a.n.localeCompare(b.n));
  } else if(orden==="alfabetico"){
    rows.sort((a,b)=>a.n.localeCompare(b.n));
  }
  // "categoria": orden natural del array D (agrupado por categoría)
  if(sinStockAlFinal){
    const out=r=>{const s=stockState[r.n];return s&&s.stock<=0?1:0;};
    rows.sort((a,b)=>out(a)-out(b));// sort estable: conserva el orden interno
  }

  // Reset clases de layout y aplicar la nueva
  grid.classList.remove("store-list","store-catalog","store-menu","store-mini");
  if(layout==="lista-compacta")grid.classList.add("store-list");
  else if(layout==="catalogo-grande")grid.classList.add("store-catalog");
  else if(layout==="menu-categoria")grid.classList.add("store-menu");
  else if(layout==="grilla-compacta")grid.classList.add("store-mini");

  const combosHTML=conCombos?COMBOS_TIENDA.map(c=>buildComboCardHTML(c,layout==="menu-categoria"?"grilla":layout)).join(""):"";

  if(!rows.length&&!combosHTML){
    grid.innerHTML=`<div style="color:var(--ink-faint);font-size:13px;padding:1rem">Sin productos</div>`;
    return;
  }
  if(layout==="menu-categoria"){
    // Agrupar por categoría, respetando filtro activo
    const groups={};
    rows.forEach(r=>{(groups[r.c]=groups[r.c]||[]).push(r);});
    const comboSection=combosHTML?`
      <div class="store-menu-cat">
        <div class="store-menu-cat-title">🧺 Combos <span class="count">${COMBOS_TIENDA.length}</span></div>
        <div class="cat-scroll">${combosHTML}</div>
      </div>`:"";
    const catOrder=CATS.filter(c=>c!=="Todas"&&groups[c]);
    grid.innerHTML=`<div class="store-menu-cats">${comboSection}${catOrder.map(cat=>`
      <div class="store-menu-cat">
        <div class="store-menu-cat-title">${cat} <span class="count">${groups[cat].length}</span></div>
        <div class="cat-scroll">${groups[cat].map(r=>buildStoreCardHTML(r,"grilla")).join("")}</div>
      </div>`).join("")}</div>`;
    return;
  }
  grid.innerHTML=combosHTML+rows.map(r=>buildStoreCardHTML(r,layout)).join("");
}

function buildStoreCardHTML(r,layout){
  const v=pVentas[r.n]||0;
  const compSt=stats(r.p);
  const inCart=cart[r.n]>0;
  const qty=storeQtys[r.n]||1;
  const stockInfo=stockState&&stockState[r.n]?stockState[r.n]:null;
  const sinStock=stockInfo&&stockInfo.stock<=0;
  const stockBajo=stockInfo&&stockInfo.stock>0&&stockInfo.stock<=stockInfo.stockMin;
  const compLabel=compSt.mn&&v?v<=compSt.mn?`<span style="color:var(--success-fg);font-weight:600">✓ Mejor precio</span>`:v>=compSt.mx?`<span style="color:var(--danger)">Más caro del mercado</span>`:`Comp: ${fmt(compSt.mn)}–${fmt(compSt.mx)}`:"";
  const stockBadge=sinStock?`<div style="position:absolute;top:8px;right:8px;background:var(--danger-bg);color:var(--danger-fg);font-size:9px;font-weight:700;padding:3px 7px;border-radius:10px">SIN STOCK</div>`:stockBajo?`<div style="position:absolute;top:8px;right:8px;background:var(--warn-bg);color:var(--warn-fg);font-size:9px;font-weight:700;padding:3px 7px;border-radius:10px">${stockInfo.stock} restantes</div>`:"";
  const dis=sinStock?"disabled":"";
  const disStyle=sinStock?"background:var(--ink-mute);cursor:not-allowed":"";
  const safeId=r.n.replace(/\s/g,'_');
  const addBtn=`<button class="add-btn ${inCart?"added":""}" id="abtn-${safeId}" onclick="addToCart('${r.n}')" ${dis} style="${disStyle}">${sinStock?"Sin stock":inCart?`✓ (${cart[r.n]})`:"Agregar"}</button>`;
  const qtyRow=`<div class="qty-row"><button class="qty-btn" onclick="changeQty('${r.n}',-1)" ${dis}>−</button><div class="qty-num" id="qty-${safeId}">${qty}</div><button class="qty-btn" onclick="changeQty('${r.n}',1)" ${dis}>+</button></div>`;
  const showFotos=mostrarFotosEnabled(tenants[currentTenantId]);
  const photo=showFotos?(fotos[r.n]||""):"";
  const photoBg=photo?`<div class="prod-icon-photo" style="background-image:url('${photo}')"></div>`:"";
  const iconHTML=`<div class="prod-icon" role="button" title="Ver ${r.n}" onclick="openProductView('${r.n}')">${photoBg}<span class="prod-icon-emoji">${EMOJIS[r.n]||"🌿"}</span></div>`;
  if(layout==="lista-compacta"){
    return`<div class="prod-card" id="pcard-${safeId}" style="position:relative;${sinStock?"opacity:.55":""}">
      ${stockBadge}
      ${iconHTML}
      <div class="prod-info">
        <div class="prod-name"><span class="prod-dot" data-cat="${r.c}"></span>${r.n}</div>
        <div class="prod-unit">por ${r.u}</div>
        <div class="prod-comp">${compLabel}</div>
      </div>
      <div class="prod-actions">
        <div class="prod-price">${fmt(v)}</div>
        ${addBtn}
      </div>
    </div>`;
  }
  return`<div class="prod-card" id="pcard-${safeId}" style="position:relative;${sinStock?"opacity:.55":""}">
    ${stockBadge}
    ${iconHTML}
    <div>
      <div class="prod-name"><span class="prod-dot" data-cat="${r.c}"></span>${r.n}</div>
      <div class="prod-unit">por ${r.u}</div>
    </div>
    <div class="prod-price">${fmt(v)}</div>
    <div class="prod-comp">${compLabel}</div>
    ${qtyRow}
    <button class="add-btn ${inCart?"added":""}" id="abtn-${safeId}" onclick="addToCart('${r.n}')" ${dis} style="${disStyle}">
      ${sinStock?"Sin stock":inCart?`✓ En carrito (${cart[r.n]})`:"Agregar al carrito"}
    </button>
  </div>`;
}

function changeQty(nombre,delta){
  const key=nombre.replace(/\s/g,'_');
  storeQtys[nombre]=Math.max(1,(storeQtys[nombre]||1)+delta);
  const el=document.getElementById("qty-"+key);
  if(el)el.textContent=storeQtys[nombre];
}

function addToCart(nombre){
  const qty=storeQtys[nombre]||1;
  cart[nombre]=(cart[nombre]||0)+qty;
  storeQtys[nombre]=1;
  updateCartBadge();
  renderStoreGrid();
  updateCartBar();
  // micro feedback: el botón de la card muestra "✓ Agregado" momentáneamente (renderStoreGrid ya lo refleja)
}

function updateCartBar(){
  const bar=document.getElementById("cart-bar");
  if(!bar)return;
  const items=Object.entries(cart).filter(([,q])=>q>0);
  const totalItems=items.reduce((a,[,q])=>a+q,0);
  const subtotal=items.reduce((a,[n,q])=>a+(pVentas[n]||0)*q,0);
  if(!totalItems){
    bar.classList.remove("show");
    return;
  }
  bar.classList.add("show");
  const countEl=document.getElementById("cart-bar-count");
  const previewEl=document.getElementById("cart-bar-preview");
  const totalEl=document.getElementById("cart-bar-total");
  if(countEl)countEl.textContent=`${totalItems} ${totalItems===1?"producto":"productos"}`;
  if(totalEl)totalEl.textContent=fmt(subtotal)||"$0";
  if(previewEl){
    // muestra los emojis de los primeros productos
    const emojis=items.slice(0,6).map(([n])=>EMOJIS[n]||"🌿").join(" ");
    const more=items.length>6?` +${items.length-6}`:"";
    previewEl.textContent=emojis+more;
  }
}

function updateCartBadge(){
  const total=Object.values(cart).reduce((a,b)=>a+b,0);
  // actualiza todos los badges/labels visibles (Tienda, Recetas, etc.)
  document.querySelectorAll(".js-cart-badge").forEach(b=>{
    b.style.display=total>0?"flex":"none";
    b.textContent=total;
  });
  document.querySelectorAll(".js-cart-label").forEach(l=>{
    l.textContent=total>0?`(${total} items)`:"vacío";
  });
}

function prefillCheckoutForm(){
  const saved=JSON.parse(localStorage.getItem("izifud_cliente_data")||"{}");
  const set=(id,v)=>{const e=document.getElementById(id);if(e&&!e.value)e.value=v||"";};
  // Dirección: prioridad userLocation (Mi ubicación) > saved
  const dirSaved=(userLocation&&userLocation.label)||saved.direccion||"";
  set("co-direccion",dirSaved);
  set("co-telefono",saved.telefono);
  set("co-correo",saved.correo);
  set("co-pago",saved.formaDePago);
}

function getEntregaConfig(t){
  return (t&&t.entregaConfig)?t.entregaConfig:{delivery:true,pickup:true};
}
function isLocalActivo(t){
  if(!t)return false;
  return t.activo!==false;
}
function tieneEntregaHabilitada(t){
  const c=getEntregaConfig(t);
  return !!(c.delivery||c.pickup);
}
function isLocalDisponible(t){
  return isLocalActivo(t)&&tieneEntregaHabilitada(t);
}

function resolveCartModeForConfig(cfg){
  // Si el modo actual no está disponible, fallback al disponible
  if(entregaMode==="delivery"&&!cfg.delivery)return"pickup";
  if(entregaMode==="pickup"&&!cfg.pickup)return"delivery";
  return entregaMode||"delivery";
}

function applyEntregaTabsVisibility(){
  const cfg=getEntregaConfig(tenants[currentTenantId]);
  const tabs=document.querySelectorAll(".entrega-tab");
  let visible=0;
  tabs.forEach(b=>{
    const m=b.dataset.mode;
    const ok=cfg[m];
    b.style.display=ok?"flex":"none";
    if(ok)visible++;
  });
  const tabsWrap=document.querySelector(".entrega-tabs");
  if(tabsWrap)tabsWrap.style.display=visible>1?"grid":"none";
}

function setEntregaMode(mode,force){
  const cfg=getEntregaConfig(tenants[currentTenantId]);
  if(!cfg[mode])mode=cfg.delivery?"delivery":"pickup";
  if(!force&&entregaMode===mode)return;
  entregaMode=mode;
  applyEntregaTabsVisibility();
  document.querySelectorAll(".entrega-tab").forEach(b=>{
    b.classList.toggle("on",b.dataset.mode===mode);
  });
  const del=document.getElementById("entrega-delivery");
  const pick=document.getElementById("entrega-pickup");
  if(del)del.style.display=mode==="delivery"?"flex":"none";
  if(pick)pick.style.display=mode==="pickup"?"flex":"none";
  if(mode==="pickup")renderPickupInfo();
  renderCartFoot();
}

  if(cartMiniMap||typeof L==="undefined")return;
  const el=document.getElementById("cart-mini-map");
  if(!el)return;
  const center=userLocation?[userLocation.lat,userLocation.lng]:[-34.6037,-58.3816];
  cartMiniMap=L.map(el,{zoomControl:false,attributionControl:false}).setView(center,userLocation?14:11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(cartMiniMap);
  L.control.zoom({position:"topright"}).addTo(cartMiniMap);
  cartMiniMap.on("click",e=>{
    setCartLocation(e.latlng.lat,e.latlng.lng,"Punto seleccionado en el mapa");
  });
}

function updateCartMiniMap(){
  if(!cartMiniMap||!userLocation)return;
  if(cartMiniMarker)cartMiniMap.removeLayer(cartMiniMarker);
  const icon=L.divIcon({
    className:"user-marker",
    html:`<div style="width:20px;height:20px;background:var(--info);border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.4)"></div>`,
    iconSize:[20,20],iconAnchor:[10,10]
  });
  cartMiniMarker=L.marker([userLocation.lat,userLocation.lng],{icon}).addTo(cartMiniMap);
  cartMiniMap.setView([userLocation.lat,userLocation.lng],14);
  setTimeout(()=>cartMiniMap.invalidateSize(),50);
}

function setCartLocation(lat,lng,label){
  // sync con Mi ubicación (también actualiza el mapa grande)
  if(typeof setUserLocation==="function"){
    setUserLocation(lat,lng,label);
  } else {
    userLocation={lat,lng,label};
  }
  const inp=document.getElementById("co-direccion");
  if(inp)inp.value=label||`${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  updateCartMiniMap();
}

async function geocodeCartAddress(){
  const inp=document.getElementById("co-direccion");
  const q=(inp?.value||"").trim();
  if(!q){inp?.classList.add("invalid");return;}
  inp?.classList.remove("invalid");
  const query=q.toLowerCase().includes("argentina")?q:`${q}, Buenos Aires, Argentina`;
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
    const data=await r.json();
    if(!data.length){alert("No se encontró esa dirección. Probá con más detalle.");return;}
    const result=data[0];
    setCartLocation(parseFloat(result.lat),parseFloat(result.lon),result.display_name.split(",").slice(0,3).join(","));
  }catch(e){alert("Error al buscar la dirección: "+e.message);}
}

function useCurrentLocationInCart(){
  if(!navigator.geolocation){alert("Tu navegador no soporta geolocalización");return;}
  navigator.geolocation.getCurrentPosition(
    pos=>setCartLocation(pos.coords.latitude,pos.coords.longitude,"Mi ubicación actual (GPS)"),
    err=>alert("No se pudo obtener tu ubicación: "+err.message)
  );
}

function renderCartItems(){
  const el=document.getElementById("cart-items");
  if(!el)return;
  const items=Object.entries(cart).filter(([,q])=>q>0);
  if(!items.length){el.innerHTML=`<div class="cart-empty">🛒<br>Tu carrito está vacío</div>`;return;}
  el.innerHTML=items.map(([nombre,qty])=>{
    const r=D.find(x=>x.n===nombre);
    const v=pVentas[nombre]||0;
    return`<div class="cart-item">
      <div class="cart-item-icon">${EMOJIS[nombre]||"🌿"}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${nombre}</div>
        <div class="cart-item-unit">por ${r?r.u:""}</div>
        <div class="cart-item-qty">
          <button class="cqb" onclick="cartChangeQty('${nombre}',-1)">−</button>
          <span class="cq-num">${qty}</span>
          <button class="cqb" onclick="cartChangeQty('${nombre}',1)">+</button>
          <button class="cqb" style="margin-left:4px;color:var(--danger);border-color:oklch(85% 0.05 25)" onclick="cartRemove('${nombre}')">✕</button>
        </div>
      </div>
      <div class="cart-item-price">${fmt(v*qty)}</div>
    </div>`;
  }).join("");
}

function cartChangeQty(nombre,delta){
  cart[nombre]=Math.max(0,(cart[nombre]||0)+delta);
  if(cart[nombre]===0)delete cart[nombre];
  updateCartBadge();
  renderCartItems();
  renderCartFoot();
  renderStoreGrid();
  updateCartBar();
}
function cartRemove(nombre){cartChangeQty(nombre,-(cart[nombre]||0));}

function renderCartFoot(){
  const subtotal=Object.entries(cart).reduce((acc,[n,q])=>acc+(pVentas[n]||0)*q,0);
  let costoEnvio=0,gratis=true,envioText="",envioColor="var(--surface-2)";
  if(entregaMode==="delivery"){
    const selEl=document.getElementById("cart-zona-sel");
    const zi=selEl?parseInt(selEl.value):0;
    const z=zonas[zi]||zonas[0];
    gratis=subtotal>=z.freeMin;
    costoEnvio=gratis?0:z.costoFijo;
    const faltaStr=gratis?"":`Agregá ${fmt(z.freeMin-subtotal)} más para envío gratis`;
    envioColor=gratis?"var(--success-bg)":"var(--danger-bg)";
    envioText=gratis?"✓ Envío GRATIS incluido":`Costo de envío: ${fmt(z.costoFijo)}. ${faltaStr}`;
  }
  const total=subtotal+costoEnvio;
  const subEl=document.getElementById("cart-sub");
  const totEl=document.getElementById("cart-total-val");
  const envEl=document.getElementById("cart-envio-info");
  if(subEl)subEl.textContent=fmt(subtotal)||"$0";
  if(totEl)totEl.textContent=fmt(total)||"$0";
  if(envEl){
    if(entregaMode==="delivery"){
      envEl.style.display="block";
      envEl.style.background=envioColor;
      envEl.style.color=gratis?"var(--success-fg)":"var(--danger-fg)";
      envEl.textContent=envioText;
    } else {
      envEl.style.display="none";
    }
  }
}

const FORMA_PAGO_LABEL={
  efectivo:"💵 Efectivo al recibir",
  mercadopago:"💳 Mercado Pago",
  transferencia:"🏦 Transferencia",
  tarjeta:"💳 Tarjeta al recibir"
};

function submitCheckout(){
  const items=Object.entries(cart).filter(([,q])=>q>0);
  if(!items.length){alert("Tu carrito está vacío");return;}
  if(!isLocalDisponible(tenants[currentTenantId])){
    alert("Este local no está aceptando pedidos en este momento.");
    return;
  }
  const telefono=(document.getElementById("co-telefono")?.value||"").trim();
  const correo=(document.getElementById("co-correo")?.value||"").trim();
  const formaDePago=document.getElementById("co-pago")?.value||"";
  const direccion=entregaMode==="delivery"?(document.getElementById("co-direccion")?.value||"").trim():"";
  const errors=[];
  const markInvalid=(id,bad)=>{
    const el=document.getElementById(id);
    if(el)el.classList.toggle("invalid",bad);
  };
  if(entregaMode==="delivery"){
    if(direccion.length<5){errors.push("Ingresá una dirección de entrega válida");markInvalid("co-direccion",true);}else markInvalid("co-direccion",false);
  } else markInvalid("co-direccion",false);
  const telDigits=telefono.replace(/\D/g,"");
  if(telDigits.length<6){errors.push("Ingresá un teléfono válido");markInvalid("co-telefono",true);}else markInvalid("co-telefono",false);
  if(correo&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)){errors.push("El correo no parece válido");markInvalid("co-correo",true);}else markInvalid("co-correo",false);
  if(!formaDePago){errors.push("Elegí una forma de pago");markInvalid("co-pago",true);}else markInvalid("co-pago",false);
  const errEl=document.getElementById("co-error");
  if(errors.length){
    if(errEl){errEl.textContent=errors.join(" · ");errEl.classList.add("show");}
    return;
  }
  if(errEl)errEl.classList.remove("show");
  const subtotal=Object.entries(cart).reduce((acc,[n,q])=>acc+(pVentas[n]||0)*q,0);
  let zonaNombre="",costoEnvio=0,gratis=true;
  if(entregaMode==="delivery"){
    const selEl=document.getElementById("cart-zona-sel");
    const zi=selEl?parseInt(selEl.value)||0:0;
    const z=zonas[zi]||zonas[0];
    gratis=subtotal>=z.freeMin;
    costoEnvio=gratis?0:z.costoFijo;
    zonaNombre=z.nombre;
  } else {
    const t=tenants[currentTenantId];
    zonaNombre=t?`Retiro en ${t.nombre}`:"Retiro en local";
  }
  const total=subtotal+costoEnvio;
  const pedido={
    id:"ORD-"+Date.now().toString(36).toUpperCase(),
    fecha:new Date().toISOString(),
    items:items.map(([n,q])=>({
      nombre:n,qty:q,
      precioUnit:pVentas[n]||0,
      subtotal:(pVentas[n]||0)*q,
      unidad:(D.find(x=>x.n===n)||{}).u||"",
      emoji:EMOJIS[n]||"🌿"
    })),
    subtotal,
    zona:zonaNombre,
    costoEnvio,
    envioGratis:gratis,
    total,
    tipoEntrega:entregaMode,
    cliente:{nombre:getClienteData().nombre||"",direccion,telefono,correo,formaDePago,coords:entregaMode==="delivery"&&userLocation?{lat:userLocation.lat,lng:userLocation.lng}:null},
    estado:"pendiente"
  };
  // Paso intermedio: resumen tipo ticket para revisar antes de confirmar
  pedidoPreview=pedido;
  openResumen(pedido);
}

function confirmarPedidoFinal(){
  if(!pedidoPreview)return;
  const pedido=pedidoPreview;

  const c=pedido.cliente;
  pedidos.unshift(pedido);
  const prev=getClienteData();
  localStorage.setItem("izifud_cliente_data",JSON.stringify({...prev,
    direccion:c.direccion||prev.direccion||"",telefono:c.telefono,correo:c.correo,formaDePago:c.formaDePago}));

function escalar(cant,personas,factor){
  if(factor==="lineal")return cant*personas;
  if(factor==="fijo")return cant*2;// no depende
  // sublineal: crece pero menos que lineal — usamos formula tipo cant * personas^0.8
  return cant*Math.pow(personas,0.85);
}

function buildRecExpandedHTML(r){
  // Build ingredient list with calculated qty and price
  let totalCombo=0;
  let allAvailable=true;
  const ingHTML=r.ing.map(ing=>{
    const cantNeeded=escalar(ing.cantPorPersona,recetaPersonas,ing.factor);
    const cantRound=Math.ceil(cantNeeded*10)/10;
    const cantDisplay=cantRound<1?cantRound.toFixed(2):cantRound%1===0?cantRound.toString():cantRound.toFixed(1);
    const prod=D.find(x=>x.n===ing.n);
    const emoji=EMOJIS[ing.n]||"🌿";
    if(!prod){
      allAvailable=false;
      return`<div class="rec-ing-row miss">
        <div class="rec-ing-icon">${emoji}</div>
        <div class="rec-ing-info">
          <div class="rec-ing-name">${ing.n}</div>
          <div class="rec-ing-miss">No disponible en el catálogo</div>
        </div>
      </div>`;
    }
    const precioUnit=pVentas[ing.n]||0;
    const unidadesComprar=Math.ceil(cantRound);
    const subtotal=precioUnit*unidadesComprar;
    totalCombo+=subtotal;
    return`<div class="rec-ing-row">
      <div class="rec-ing-icon">${emoji}</div>
      <div class="rec-ing-info">
        <div class="rec-ing-name">${ing.n}</div>
        <div class="rec-ing-cant">Necesitás: ${cantDisplay} ${ing.unidad} → comprar ${unidadesComprar} × ${prod.u}</div>
      </div>
      <div class="rec-ing-price">${fmt(subtotal)}</div>
    </div>`;
  }).join("");

  const descuentoPct=allAvailable?5:0;
  const descuento=Math.round(totalCombo*descuentoPct/100);
  const totalFinal=totalCombo-descuento;

  return `
    <button class="rec-close" onclick="closeRecipe(event)" title="Cerrar">✕</button>
    <div class="rec-detail-head">
      <div class="rec-detail-emoji">${r.emoji}</div>
      <div class="rec-detail-info">
        <h3>${r.nombre}</h3>
        <p>${r.desc}</p>
        <div class="rec-meta" style="margin-top:8px">
          ${r.veg?'<span class="rec-tag veg">Vegetariana</span>':''}
          <span class="rec-tag time">⏱ ${r.tiempo}</span>
          <span class="rec-tag diff">${r.dificultad}</span>
        </div>
      </div>
      <div class="rec-personas">
        <span class="rec-personas-lbl">👥 Personas</span>
        <button class="rec-personas-btn" onclick="changePersonas(-1);event.stopPropagation()">−</button>
        <span class="rec-personas-num">${recetaPersonas}</span>
        <button class="rec-personas-btn" onclick="changePersonas(1);event.stopPropagation()">+</button>
      </div>
    </div>

    <div class="rec-ingredientes">
      <div class="rec-ing-title">🛒 Ingredientes para ${recetaPersonas} ${recetaPersonas===1?"persona":"personas"}</div>
      <div class="rec-ing-list">${ingHTML}</div>
    </div>

    <div class="rec-summary">
      <div class="rec-summary-row"><span>Subtotal verduras</span><span>${fmt(totalCombo)}</span></div>
      ${descuento>0?`<div class="rec-summary-row" style="color:var(--success-fg)"><span>Descuento combo (${descuentoPct}%)</span><span>−${fmt(descuento)}</span></div>`:''}
      <div class="rec-summary-row total"><span>Total combo</span><span>${fmt(totalFinal)}</span></div>
    </div>

    <button class="rec-add-btn" onclick="agregarComboAlCarrito('${r.id}');event.stopPropagation()" ${!allAvailable?'disabled':''}>
      ${allAvailable?`🛒 Agregar combo al carrito (${fmt(totalFinal)})`:'Algunos ingredientes no están disponibles'}
    </button>

    <div class="rec-prep">
      <h4>📝 Preparación</h4>
      <ol>${r.prep.map(s=>`<li>${s}</li>`).join("")}</ol>
    </div>
  `;
}

function agregarComboAlCarrito(recipeId){
  const r=RECETAS.find(x=>x.id===recipeId);
  if(!r)return;
  let added=0;
  r.ing.forEach(ing=>{
    const prod=D.find(x=>x.n===ing.n);
    if(!prod)return;
    const cantNeeded=escalar(ing.cantPorPersona,recetaPersonas,ing.factor);
    const unidades=Math.ceil(cantNeeded);
    cart[ing.n]=(cart[ing.n]||0)+unidades;
    added++;
  });
  updateCartBadge();
  if(typeof updateCartBar==="function")updateCartBar();
  alert(`✓ Combo "${r.nombre}" agregado al carrito\n\n${added} productos para ${recetaPersonas} ${recetaPersonas===1?"persona":"personas"}.\nVas a verlo en la barra inferior cuando entres a la Tienda.`);
}

// Haversine distance in km
function distKm(a,b){
  const R=6371;
  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function tiendasOrdenadas(){
  const all=getAllTiendas();
  if(!userLocation)return all.map(t=>({...t,dist:null}));
  return all.map(t=>({...t,dist:distKm(userLocation,t)})).sort((a,b)=>a.dist-b.dist);
}

    opts:{attribution:'© OpenStreetMap · © CARTO', subdomains:'abcd', maxZoom:20}

    opts:{attribution:'© OpenStreetMap', maxZoom:19}
  }
};
let currentMapStyle="voyager";
let tileLayerRef=null;

function applyMapStyle(styleKey){
  if(!mapInstance||!MAP_STYLES[styleKey])return;
  currentMapStyle=styleKey;
  if(tileLayerRef)mapInstance.removeLayer(tileLayerRef);
  const s=MAP_STYLES[styleKey];
  tileLayerRef=L.tileLayer(s.url,s.opts).addTo(mapInstance);
  tileLayerRef.setZIndex(0);
  // update picker UI
  document.querySelectorAll(".map-style-btn").forEach(b=>{
    b.classList.toggle("on",b.dataset.style===styleKey);
  });
}

function buildMapStylePicker(){
  const picker=document.getElementById("map-style-picker");
  if(!picker||picker.dataset.built)return;
  picker.dataset.built="1";
  Object.entries(MAP_STYLES).forEach(([key,s])=>{
    const b=document.createElement("button");
    b.className="map-style-btn"+(key===currentMapStyle?" on":"");
    b.textContent=s.label;
    b.dataset.style=key;
    b.onclick=()=>applyMapStyle(key);
    picker.appendChild(b);
  });
}

function initMap(){
  if(mapInstance)return;
  if(typeof L==="undefined"){
    document.getElementById("map-container").innerHTML=`<div style="padding:2rem;text-align:center;color:var(--ink-soft)">No se pudo cargar el mapa. Verificá tu conexión a internet.</div>`;
    return;
  }
  mapInstance=L.map("map-container").setView([DEFAULT_CENTER.lat,DEFAULT_CENTER.lng],11);
  applyMapStyle(currentMapStyle);
  buildMapStylePicker();

  rebuildMapMarkers();

  // map click sets user location
  mapInstance.on("click",e=>{

}

// ─── ESTILO DE PINES (personalizable) ────────────────────
const DEFAULT_PIN_STYLE={
  shape:"pin",        // "circle" | "pin" | "rounded" | "square"
  size:38,            // px
  borderWidth:3,
  borderColor:"#ffffff",
  shadow:"medium",    // "none" | "soft" | "medium" | "strong"
  content:"icono",    // "icono" | "inicial" | "foto" | "ninguno"
  randomColors:true,  // colores aleatorios por verdulería
  fixedColor:"#1a6630",
  photo:null,         // dataURL si content==="foto"
};
// pinStyle vive por-tenant; se guarda en su data
let pinStyle={...DEFAULT_PIN_STYLE};

// Paleta de colores agradables para asignación aleatoria estable
const PIN_PALETTE=["#1a6630","#2563eb","#dc2626","#d97706","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#4f46e5"];
function colorForId(id){
  // hash estable del id -> índice de paleta
  let h=0;
  for(let i=0;i<id.length;i++){h=(h*31+id.charCodeAt(i))>>>0;}
  return PIN_PALETTE[h%PIN_PALETTE.length];
}

function shadowCss(level){
  return{
    none:"none",
    soft:"0 1px 3px rgba(0,0,0,.2)",
    medium:"0 2px 8px rgba(0,0,0,.3)",
    strong:"0 4px 14px rgba(0,0,0,.45)"
  }[level]||"0 2px 8px rgba(0,0,0,.3)";
}

function borderRadiusForShape(shape,size){
  if(shape==="circle"||shape==="pin")return"50%";
  if(shape==="rounded")return Math.round(size*0.28)+"px";
  return"2px";// square
}

// Genera el HTML interno del pin segun el estilo y la tienda
function buildPinHTML(t,style){
  const isMine=t.mia;
  const st=style||pinStyle;
  // tamaño: las mías un poco mas grandes, competencia algo menor
  const baseSize=st.size;
  const size=isMine?baseSize:Math.round(baseSize*0.82);
  // color
  let color;
  if(!isMine){
    color=t.color||"#888";// competencia mantiene su color
  } else if(st.randomColors){
    color=colorForId(t.tenantId||t.id||t.nombre);
  } else {
    color=st.fixedColor;
  }
  // contenido
  let inner="";
  let bg=color;
  const tenantPhoto=isMine&&t.tenantId&&tenants[t.tenantId]?tenants[t.tenantId].photo:null;
  if(st.content==="foto"&&isMine&&tenantPhoto){
    bg=`center/cover url('${tenantPhoto}')`;
    inner="";
  } else if(st.content==="icono"){
    inner=isMine?(t.icono||"🏪"):t.nombre[0];
  } else if(st.content==="inicial"){
    inner=t.nombre[0].toUpperCase();
  } else if(st.content==="ninguno"){
    inner="";
  } else {
    inner=isMine?(t.icono||"🏪"):t.nombre[0];
  }
  const radius=borderRadiusForShape(st.shape,size);
  const shadow=shadowCss(st.shadow);
  const fontSize=Math.round(size*0.42);
  const border=`${st.borderWidth}px solid ${st.borderColor}`;

  if(st.shape==="pin"){
    // forma de gota (teardrop) clásica de mapa
    const ps=size;
    return{
      html:`<div style="position:relative;width:${ps}px;height:${Math.round(ps*1.3)}px">
        <div style="box-sizing:border-box;position:absolute;top:0;left:0;width:${ps}px;height:${ps}px;background:${bg};border:${border};border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:${shadow};display:flex;align-items:center;justify-content:center">
          <span style="transform:rotate(45deg);color:#fff;font-weight:700;font-size:${fontSize}px;line-height:1">${inner}</span>
        </div>
      </div>`,
      w:ps, h:Math.round(ps*1.3), anchorX:ps/2, anchorY:Math.round(ps*1.3)
    };
  }
  // circle / rounded / square
  return{
    html:`<div style="box-sizing:border-box;flex-shrink:0;width:${size}px;height:${size}px;background:${bg};border:${border};border-radius:${radius};display:flex;align-items:center;justify-content:center;box-shadow:${shadow};color:#fff;font-weight:700;font-size:${fontSize}px;line-height:1">${inner}</div>`,
    w:size, h:size, anchorX:size/2, anchorY:size/2
  };
}

function rebuildMapMarkers(){
  if(!mapInstance)return;
  // Remove existing markers
  Object.values(tiendaMarkers).forEach(m=>mapInstance.removeLayer(m));
  tiendaMarkers={};
  // Add markers for all tiendas (mine + competition)
  getAllTiendas().forEach(t=>{
    const isMine=t.mia;
    const pin=buildPinHTML(t);
    const icon=L.divIcon({
      className:"tienda-marker",
      html:pin.html,
      iconSize:[pin.w,pin.h],
      iconAnchor:[pin.anchorX,pin.anchorY]
    });
    const marker=L.marker([t.lat,t.lng],{icon}).addTo(mapInstance);
    const tag=isMine?'<span style="background:var(--brand);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px">SOCIO IZIFUD</span>':'<span style="background:var(--ink-soft);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px">REFERENCIA</span>';
    marker.bindPopup(`<b>${t.nombre}${tag}</b>${t.direccion}<br><span style="color:var(--ink-soft)">${t.zona}</span><br>📦 ${t.entrega}`);
    marker.on("click",()=>selectTienda(t.id));
    tiendaMarkers[t.id]=marker;
  });
}

function setUserLocation(lat,lng,label){
  userLocation={lat,lng,label};
  if(!mapInstance)return;
  if(userMarker)mapInstance.removeLayer(userMarker);
  const icon=L.divIcon({
    className:"user-marker",
    html:`<div style="width:22px;height:22px;background:var(--info);border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.4)"></div>`,
    iconSize:[22,22],
    iconAnchor:[11,11]
  });
  userMarker=L.marker([lat,lng],{icon}).addTo(mapInstance);
  userMarker.bindPopup(`<b>📍 Tu ubicación</b>${label||""}`);
  // Auto-select closest tienda
  const ordered=tiendasOrdenadas();
  if(ordered[0])selectedTienda=ordered[0].id;
  // Fit map to show user + closest tienda
  if(ordered[0]){
    const bounds=L.latLngBounds([[lat,lng],[ordered[0].lat,ordered[0].lng]]).pad(0.3);
    mapInstance.fitBounds(bounds);
  } else {
    mapInstance.setView([lat,lng],13);
  }
  renderTiendaList();
  renderUbiCurrent();
}

function selectTienda(id){
  selectedTienda=id;
  renderTiendaList();
  const t=getAllTiendas().find(x=>x.id===id);
  if(t&&mapInstance){
    mapInstance.setView([t.lat,t.lng],14);
    if(tiendaMarkers[id])tiendaMarkers[id].openPopup();
  }
}

function renderTiendaList(){
  const el=document.getElementById("tienda-list");
  if(!el)return;
  const ordered=tiendasOrdenadas();
  if(!userLocation){
    el.innerHTML=`<div class="tienda-empty">Configurá tu ubicación para ver los locales ordenados por cercanía.</div>` +
      ordered.map(t=>`
        <div class="tienda-row ${selectedTienda===t.id?"sel":""} ${t.mia?"is-mia":""}" onclick="selectTienda('${t.id}')">
          <div class="tienda-top">
            <div class="tienda-color" style="background:${t.color}"></div>
            <div class="tienda-name">${t.mia?(t.icono||"🏪")+" ":""}${t.nombre}</div>
            ${t.mia?'<span class="mia-badge">MÍA</span>':''}
          </div>
          <div class="tienda-addr">${t.direccion}</div>
          <div class="tienda-meta"><span class="tienda-tiempo">${t.zona}</span><span class="tienda-tiempo">📦 ${t.entrega}</span></div>
        </div>
      `).join("");
    return;
  }
  el.innerHTML=ordered.map((t,i)=>{
    const distStr=t.dist<1?`${Math.round(t.dist*1000)} m`:`${t.dist.toFixed(1)} km`;
    const tiempo=Math.round(t.dist*4+15);// estimación rough delivery
    return`
      <div class="tienda-row ${selectedTienda===t.id?"sel":""} ${i===0?"closest":""} ${t.mia?"is-mia":""}" onclick="selectTienda('${t.id}')">
        ${i===0?'<div class="closest-badge">⭐ MÁS CERCA</div>':''}
        <div class="tienda-top">
          <div class="tienda-color" style="background:${t.color}"></div>
          <div class="tienda-name">${t.mia?(t.icono||"🏪")+" ":""}${t.nombre}</div>
          ${t.mia?'<span class="mia-badge">MÍA</span>':''}
          <div class="tienda-dist">${distStr}</div>
        </div>
        <div class="tienda-addr">${t.direccion}</div>
        <div class="tienda-meta"><span class="tienda-tiempo">⏱ ~${tiempo} min</span><span class="tienda-tiempo">📦 ${t.entrega}</span></div>
      </div>`;
  }).join("");
}

function renderUbiCurrent(){
  const el=document.getElementById("ubi-current");
  if(!el)return;
  if(!userLocation){
    el.innerHTML=`<em style="color:var(--ink-mute)">Aún no configuraste una ubicación</em>`;
    return;
  }
  const ordered=tiendasOrdenadas();
  const closest=ordered[0];
  const distStr=closest?(closest.dist<1?`${Math.round(closest.dist*1000)} m`:`${closest.dist.toFixed(1)} km`):"-";
  el.innerHTML=`
    <strong>${userLocation.label||"Ubicación seleccionada"}</strong><br>
    Coordenadas: ${userLocation.lat.toFixed(4)}, ${userLocation.lng.toFixed(4)}<br>
    ${closest?`Más cercana: <strong>${closest.nombre}</strong> a ${distStr}`:""}`;
}

async function buscarDireccion(){
  const input=document.getElementById("ubi-addr");
  const q=input.value.trim();
  if(!q){alert("Ingresá una dirección");return;}
  // Append Argentina if not specified
  const query=q.toLowerCase().includes("argentina")?q:`${q}, Buenos Aires, Argentina`;
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
    const data=await r.json();
    if(!data.length){alert("No se encontró la dirección. Probá con más detalle (ej: calle, número, barrio)");return;}
    const result=data[0];
    setUserLocation(parseFloat(result.lat),parseFloat(result.lon),result.display_name.split(",").slice(0,3).join(","));
  }catch(e){
    alert("Error al buscar la dirección: "+e.message);
  }
}

function usarMiUbicacion(){
  if(!navigator.geolocation){alert("Tu navegador no soporta geolocalización");return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{
      setUserLocation(pos.coords.latitude,pos.coords.longitude,"Tu ubicación actual (GPS)");
    },
    err=>{
      alert("No se pudo obtener tu ubicación: "+err.message+"\n\nProbá ingresar la dirección manualmente.");
    },
    {enableHighAccuracy:true,timeout:10000}
  );
}

// stock state per product
let stockState={};
// seed deterministico: hash del nombre para que el demo no cambie en cada reload
function _seedFromName(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0}return(h%1000)/1000}
D.forEach(r=>{
  const rnd=_seedFromName(r.n);
  stockState[r.n]={
    activo: true,
    stock: Math.floor(rnd*36)+4,
    stockMin: 5,
  };
});

let stockFilters={cat:"Todas",search:"",status:"all"};
let stockSort={col:null,dir:1};
let stockOriginalVals={};// track original to highlight changes

function stockStatus(n){
  const s=stockState[n];
  if(!s||!s.activo)return"off";
  if(s.stock<=0)return"out";
  if(s.stock<=s.stockMin)return"low";
  return"ok";
}
function stockStatusLabel(st){
  return{ok:"✓ OK",low:"⚠ Bajo",out:"✗ Sin stock",off:"○ Inactivo"}[st]||"";
}

function filteredStock(){
  return getMenu().filter(r=>{
    if(stockFilters.cat!=="Todas"&&r.c!==stockFilters.cat)return false;
    if(stockFilters.search&&!r.n.toLowerCase().includes(stockFilters.search))return false;
    if(stockFilters.status!=="all"&&stockStatus(r.n)!==stockFilters.status)return false;
    return true;
  });
}

function renderStockSummary(){
  const el=document.getElementById("stock-summary");
  if(!el)return;
  const all=getMenu();
  const activos=all.filter(r=>stockState[r.n].activo);
  const bajos=all.filter(r=>stockStatus(r.n)==="low");
  const sinStock=all.filter(r=>stockStatus(r.n)==="out");
  const valorTotal=all.reduce((a,r)=>{
    return a+(stockState[r.n].activo?stockState[r.n].stock*(costos[r.n]||0):0);
  },0);
  const margProm=(()=>{
    const arr=activos.map(r=>margen(costos[r.n],pVentas[r.n])).filter(x=>x!=null);
    return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
  })();
  el.innerHTML=`
    <div class="summary-card ok"><div class="lbl">Activos</div><div class="val">${activos.length}/${all.length}</div></div>
    <div class="summary-card warn"><div class="lbl">Stock bajo</div><div class="val">${bajos.length}</div></div>
    <div class="summary-card bad"><div class="lbl">Sin stock</div><div class="val">${sinStock.length}</div></div>
    <div class="summary-card"><div class="lbl">Valor stock</div><div class="val">${fmt(valorTotal)||"$0"}</div></div>
    <div class="summary-card ${margProm>=margenObj?"ok":margProm>=20?"warn":"bad"}"><div class="lbl">Margen prom</div><div class="val">${Math.round(margProm)}%</div></div>`;
}

function renderStockTable(){
  let rows=filteredStock();
  if(stockSort.col){
    rows=[...rows].sort((a,b)=>{
      let va,vb;
      const c=stockSort.col;
      if(c==="name"){va=a.n;vb=b.n;}
      else if(c==="cat"){va=a.c;vb=b.c;}
      else if(c==="costo"){va=costos[a.n]||0;vb=costos[b.n]||0;}
      else if(c==="venta"){va=pVentas[a.n]||0;vb=pVentas[b.n]||0;}
      else if(c==="margen"){va=margen(costos[a.n],pVentas[a.n])||0;vb=margen(costos[b.n],pVentas[b.n])||0;}
      else if(c==="stock"){va=stockState[a.n].stock;vb=stockState[b.n].stock;}
      else if(c==="stockMin"){va=stockState[a.n].stockMin;vb=stockState[b.n].stockMin;}
      else if(c==="status"){va=stockStatus(a.n);vb=stockStatus(b.n);}
      if(typeof va==="string")return va.localeCompare(vb)*stockSort.dir;
      return(va-vb)*stockSort.dir;
    });
  }
  const tb=document.getElementById("stock-tbody");
  if(!tb)return;
  tb.innerHTML=rows.map(r=>{
    const s=stockState[r.n];
    const c=costos[r.n]||0,v=pVentas[r.n]||0;
    const mg=margen(c,v);
    const mgClass=mg>=margenObj?"good":mg>=20?"warn":"bad";
    const st=stockStatus(r.n);
    const stLabel=stockStatusLabel(st);
    const emoji=EMOJIS[r.n]||"🌿";
    return`<tr class="stock-row ${!s.activo?"disabled":""}">
      <td><input type="checkbox" class="stock-check" ${s.activo?"checked":""} onchange="toggleActive('${r.n}',this.checked)"></td>
      <td class="name-td"><span class="stock-emoji">${emoji}</span><span class="stock-name">${r.n}</span><span class="stock-unit">por ${r.u}</span></td>
      <td><span style="font-size:11px;color:var(--ink-soft)">${r.c}</span></td>
      <td><input type="number" class="stock-input" value="${c}" onchange="updateField('${r.n}','costo',this.value)"></td>
      <td><input type="number" class="stock-input" value="${v}" onchange="updateField('${r.n}','venta',this.value)"></td>
      <td><span class="stock-margen-mini ${mgClass}">${mg?Math.round(mg)+"%":"—"}</span></td>
      <td><input type="number" class="stock-input qty" value="${s.stock}" min="0" onchange="updateField('${r.n}','stock',this.value)"></td>
      <td><input type="number" class="stock-input qty" value="${s.stockMin}" min="0" onchange="updateField('${r.n}','stockMin',this.value)"></td>
      <td><span class="stock-status ${st}">${stLabel}</span></td>
      <td><div class="stock-actions">
        <button class="stock-act-btn" title="Editar detalles" onclick="openProductEditor('${r.n}')">✎</button>
        <button class="stock-act-btn" title="Reponer +20" onclick="repon('${r.n}',20)">+20</button>
        <button class="stock-act-btn" title="Vaciar stock" onclick="updateField('${r.n}','stock',0)">∅</button>
      </div></td>
    </tr>`;
  }).join("")||`<tr><td colspan="10" style="text-align:center;padding:1.5rem;color:var(--ink-faint)">Sin productos para mostrar</td></tr>`;
}

function toggleActive(n,active){
  stockState[n].activo=active;
  renderStockTable();renderStockSummary();
}

function toggleAll(checked){
  filteredStock().forEach(r=>{stockState[r.n].activo=checked;});
  renderStockTable();renderStockSummary();
}

function updateField(n,field,val){
  const num=parseInt(val)||0;
  if(field==="costo")costos[n]=num;
  else if(field==="venta")pVentas[n]=num;
  else if(field==="stock")stockState[n].stock=Math.max(0,num);
  else if(field==="stockMin")stockState[n].stockMin=Math.max(0,num);
  renderStockTable();renderStockSummary();
  // also refresh other tabs if they exist

let viewingProduct=null;

function openProductView(nombre){
  const r=D.find(x=>x.n===nombre);
  if(!r)return;
  viewingProduct=nombre;
  renderProductView();
  document.getElementById("prod-view-overlay").classList.add("open");
  document.getElementById("prod-view-modal").classList.add("open");
}

function closeProductView(){
  document.getElementById("prod-view-overlay")?.classList.remove("open");
  document.getElementById("prod-view-modal")?.classList.remove("open");
  viewingProduct=null;
}

function renderProductView(){
  const nombre=viewingProduct;
  const cont=document.getElementById("prod-view-content");
  if(!nombre||!cont)return;
  const r=D.find(x=>x.n===nombre);
  if(!r)return;
  const v=pVentas[nombre]||0;
  const compSt=stats(r.p);
  // En el modal la foto se muestra siempre que exista (el toggle mostrarFotos
  // solo afecta las cards; el modal es justamente "ver la imagen si lo desea")
  const photo=fotos[nombre]||"";
  const emoji=EMOJIS[nombre]||"🌿";
  const s=stockState[nombre];
  const sinStock=s&&s.stock<=0;
  const stockBajo=s&&s.stock>0&&s.stock<=s.stockMin;
  const qty=storeQtys[nombre]||1;
  const inCart=cart[nombre]>0;
  const compLabel=compSt.mn&&v?v<=compSt.mn?`<span style="color:var(--success-fg);font-weight:600">✓ Mejor precio del mercado</span>`:v>=compSt.mx?`<span style="color:var(--danger)">Más caro del mercado</span>`:`Competencia: ${fmt(compSt.mn)}–${fmt(compSt.mx)}`:"";
  const meses=estacionalidad[nombre]||MESES_ALL;
  // Para platos (sin estacionalidad configurada) la franja no se muestra
  const tempStr=meses.length<12?"📅 Temporada: "+meses.map(m=>MESES_NAMES[m]).join(" · "):"";
  const stockTag=sinStock
    ?`<span class="pv-stock-tag" style="background:var(--danger-bg);color:var(--danger-fg)">SIN STOCK</span>`
    :stockBajo?`<span class="pv-stock-tag" style="background:var(--warn-bg);color:var(--warn-fg)">⚠ Quedan ${s.stock}</span>`
    :`<span class="pv-stock-tag" style="background:var(--success-bg);color:var(--success-fg)">✓ Disponible</span>`;
  const dis=sinStock?"disabled":"";
  cont.innerHTML=`
    <div class="pv-photo" style="${photo?`background-image:url('${photo}')`:""}">
      ${photo?"":`<span class="pv-emoji">${emoji}</span>`}
      ${stockTag}
      <button class="pv-close" onclick="closeProductView()" aria-label="Cerrar">✕</button>
    </div>
    <div class="pv-body">
      <div class="pv-name"><span class="prod-dot" data-cat="${r.c}"></span>${emoji} ${nombre}</div>
      <div class="pv-meta">${r.c} · se vende por ${r.u}</div>
      <div class="pv-price">${fmt(v)}</div>
      ${compLabel?`<div class="pv-comp">${compLabel}</div>`:""}
      ${tempStr?`<div class="pv-temp">${tempStr}</div>`:""}
      <div class="pv-actions">
        <div class="qty-row">
          <button class="qty-btn" onclick="pvChangeQty(-1)" ${dis}>−</button>
          <div class="qty-num">${qty}</div>
          <button class="qty-btn" onclick="pvChangeQty(1)" ${dis}>+</button>
        </div>
        <button class="add-btn ${inCart?"added":""}" onclick="pvAddToCart()" ${dis} style="${sinStock?"background:var(--ink-mute);cursor:not-allowed":""}">
          ${sinStock?"Sin stock":inCart?`✓ En carrito (${cart[nombre]}) · agregar más`:"Agregar al carrito"}
        </button>
      </div>
    </div>`;
}

function pvChangeQty(delta){
  if(!viewingProduct)return;
  storeQtys[viewingProduct]=Math.max(1,(storeQtys[viewingProduct]||1)+delta);
  renderProductView();
}

function pvAddToCart(){
  if(!viewingProduct)return;
  addToCart(viewingProduct);
  closeProductView();
}

function openComboView(id){

      <div class="pv-price">${fmt(info.final)} <span class="combo-tachado" style="font-size:14px">${fmt(info.bruto)}</span></div>

function saveProductEdit(){
  const n=editingProduct;
  if(!n)return;
  const photo=(document.getElementById("pe-photo")?.value||"").trim();
  const costo=parseInt(document.getElementById("pe-costo")?.value)||0;
  const venta=parseInt(document.getElementById("pe-venta")?.value)||0;
  const stock=Math.max(0,parseInt(document.getElementById("pe-stock")?.value)||0);
  const stockMin=Math.max(0,parseInt(document.getElementById("pe-stockmin")?.value)||0);
  const prov=document.getElementById("pe-proveedor")?.value||"";
  const activo=document.getElementById("pe-activo")?.checked||false;
  if(photo)fotos[n]=photo; else delete fotos[n];
  costos[n]=costo;
  pVentas[n]=venta;
  if(stockState[n]){stockState[n].stock=stock;stockState[n].stockMin=stockMin;stockState[n].activo=activo;}
  else stockState[n]={activo,stock,stockMin};
  if(prov)proveedores[n]=prov;
  saveToLocalStorage();
  // Refrescar tablas y tienda

  if(typeof renderStockSummary==="function")renderStockSummary();
  if(typeof renderStoreGrid==="function"){

function bulkAdjustPrices(){
  const pct=parseFloat(document.getElementById("bulk-price-pct").value)||0;
  if(!confirm(`¿Aplicar ajuste de ${pct>=0?"+":""}${pct}% a ${filteredStock().length} productos?`))return;
  filteredStock().forEach(r=>{
    const v=pVentas[r.n]||0;
    pVentas[r.n]=Math.round(v*(1+pct/100));
  });
  renderStockTable();renderStockSummary();
  alert(`✓ Precios actualizados (${pct>=0?"+":""}${pct}%)`);
}

function exportCSV(){
  const rows=filteredStock();
  const headers=["Producto","Categoría","Unidad","Activo","Costo","Precio venta","Margen %","Stock","Stock mín","Estado","Proveedor"];
  const csv=[headers.join(",")];
  rows.forEach(r=>{
    const s=stockState[r.n];
    const mg=margen(costos[r.n],pVentas[r.n]);
    csv.push([
      `"${r.n}"`,r.c,r.u,s.activo?"Sí":"No",
      costos[r.n]||0,pVentas[r.n]||0,mg?Math.round(mg):0,
      s.stock,s.stockMin,stockStatusLabel(stockStatus(r.n)),
      `"${proveedores[r.n]||""}"`
    ].join(","));
  });
  const blob=new Blob([csv.join("\n")],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`stock_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();URL.revokeObjectURL(url);
}

function getTenantStyle(t){
  return (t&&t.style)?t.style:{theme:"verde-fresco",layout:"grilla",mostrarFotos:true};
}
function mostrarFotosEnabled(t){
  const s=getTenantStyle(t);
  return s.mostrarFotos!==false;// default true si no está seteado
}
function applyTenantStyle(t){
  const style=getTenantStyle(t);
  const theme=THEMES[style.theme]||THEMES["verde-fresco"];
  const root=document.documentElement;
  // limpiar todos los overrides previos (de cualquier tema)
  const allKeys=new Set();
  Object.values(THEMES).forEach(th=>Object.keys(th.vars||{}).forEach(k=>allKeys.add(k)));
  allKeys.forEach(k=>root.style.removeProperty(k));
  // aplicar el tema nuevo
  Object.entries(theme.vars||{}).forEach(([k,v])=>root.style.setProperty(k,v));
  // marker para reglas adicionales (dark / lumina)
  const themeMarkers={nocturno:"dark",lumina:"lumina"};
  root.dataset.theme=themeMarkers[style.theme]||"";
  // aplicar fuente al body si el tema la define
  if(theme.vars&&theme.vars["--font-sans"]){
    document.body.style.fontFamily=theme.vars["--font-sans"];
  } else {
    document.body.style.fontFamily="";
  }
}

  proveedores=JSON.parse(JSON.stringify(t.data.proveedores));
  margenObj=t.data.margenObj||40;
  pedidos=JSON.parse(JSON.stringify(t.data.pedidos||[]));
  pedidosOpen=new Set();
  fotos=JSON.parse(JSON.stringify(t.data.fotos||{}));
  // Mergear defaults + migrar URLs históricas conocidas (sin pisar custom del user)
  Object.keys(FOTOS_DEFAULT).forEach(n=>{
    if(!(n in fotos)||FOTOS_HISTORICAS.has(fotos[n]||"")){
      fotos[n]=FOTOS_DEFAULT[n];
    }
  });
  // Merge: productos nuevos en D que no estaban en el snapshot
  D.forEach(r=>{
    if(!(r.n in costos))costos[r.n]=r.costo;
    if(!(r.n in pVentas))pVentas[r.n]=r.pVenta;
    if(!(r.n in proveedores))proveedores[r.n]=PROVEEDOR_DEFAULT[r.n]||"Mercado Central";
    if(!(r.n in stockState)){
      const rnd=_seedFromName(r.n);
      stockState[r.n]={
        activo: true,
        stock: Math.floor(rnd*36)+4,
        stockMin: 5,
      };
    }
  });
}

function switchTenant(id){
  if(id===currentTenantId)return;
  // Save current state before switching
  tenants[currentTenantId].data=snapshotCurrentState();
  // Load new tenant
  const t=tenants[id];
  if(!t){alert("Restaurante no encontrado");return;}
  loadTenantState(t);
  currentTenantId=id;
  applyTenantStyle(t);
  // Reset transient UI state
  cart={};
  storeQtys={};
  D.forEach(r=>{storeQtys[r.n]=1;});
  // Re-render everything visible EXCEPT ubicacion (we keep its map alive)
  ["original","kg","margen","sugeridos","envio","estacional","proveedor","pedidos","tienda","recetas","stock","dashboard"].forEach(id=>{
    const p=document.getElementById("panel-"+id);
    if(p)delete p.dataset.init;
  });
  // For ubicacion: rebuild markers and refresh list without destroying the map
  if(mapInstance){
    rebuildMapMarkers();
    renderTiendaList();
  }
  // Re-render the currently visible tab (use data-tab-id, not index)
  const activeTab=document.querySelector(".tab.on");
  if(activeTab){
    const tabId=activeTab.dataset.tabId;
    if(tabId&&renderMap[tabId])renderMap[tabId]();
  }
  // If admin drawer is open, refresh it
  if(document.getElementById("admin-drawer")?.classList.contains("open")){
    renderAdminDrawer();
  }
  updateGlobalHeader();
  saveToLocalStorage();
}

function updateGlobalHeader(){
  const t=tenants[currentTenantId];
  if(!t)return;
  // Topbar queda fija como marca paraguas IZIFUD
  const h1=document.querySelector(".topbar-title h1");
  if(h1)h1.textContent="IZIFUD";
  const sub=document.querySelector(".topbar-title .subtitle");
  if(sub){
    if(vistaFinal){
      // En vista cliente el subtítulo muestra el restaurante actual
      const parts=[`${t.icono||"🍽"} ${t.nombre||"Restaurante"}`];
      if(t.zona)parts.push(t.zona);
      sub.textContent=parts.join(" · ");
    } else {
      sub.textContent="Pedí online en tus restaurantes favoritos";
    }
  }
  // Sub-header: muestra el local actual
  const banner=document.getElementById("store-banner");
  if(banner){
    const parts=[];
    if(t.zona)parts.push(t.zona);
    if(t.direccion)parts.push(t.direccion);
    if(t.diasEnvio)parts.push(t.diasEnvio);

        <div class="store-banner-name">${t.nombre}</div>

      <span class="store-banner-status ${disp?"on":"off"}">${disp?"🟢":"🚫"} ${statusLabel}</span>`;
  }
  if(typeof updateSiteFooter==="function")updateSiteFooter();
  const ind=document.getElementById("info-drawer");
  if(ind&&ind.classList.contains("open"))renderInfoBody();
}

function setTenantEntrega(key,enabled){
  const t=tenants[currentTenantId];
  if(!t)return;
  if(!t.entregaConfig)t.entregaConfig={delivery:true,pickup:true};
  t.entregaConfig[key]=!!enabled;
  // refrescar UI del editor (en panel envio)
  const host=document.getElementById("entrega-config-host");
  if(host)host.innerHTML=renderEntregaConfigHTML(t);
  // refrescar carrito si está abierto
  const dr=document.getElementById("cart-drawer");
  if(dr&&dr.classList.contains("open")){
    const cfg=getEntregaConfig(t);
    if(cfg.delivery||cfg.pickup){
      setEntregaMode(resolveCartModeForConfig(cfg),true);
    }
    updateCheckoutGate();
  }
  // refrescar dashboard si está visible
  if(typeof renderDashboardContent==="function"){
    const dp=document.getElementById("dashboard-content");
    if(dp&&dp.innerHTML)renderDashboardContent();
  }
  // refrescar tienda (banner local cerrado)
  if(typeof renderStoreGrid==="function"){
    const tp=document.getElementById("panel-tienda");
    if(tp&&tp.dataset.init){renderStoreBlockedBanner();renderStoreGrid();}
  }
  autoSave();
}

function setTenantActivo(enabled){
  const t=tenants[currentTenantId];
  if(!t)return;
  t.activo=!!enabled;
  if(typeof renderDashboardContent==="function"){
    const dp=document.getElementById("dashboard-content");
    if(dp&&dp.innerHTML)renderDashboardContent();
  }
  if(typeof renderStoreGrid==="function"){
    const tp=document.getElementById("panel-tienda");
    if(tp&&tp.dataset.init){renderStoreBlockedBanner();renderStoreGrid();}
  }
  // bloquear/desbloquear checkout
  updateCheckoutGate();
  autoSave();
}

function updateCheckoutGate(){
  const btn=document.querySelector("#cart-drawer .checkout-btn");
  if(!btn)return;
  const t=tenants[currentTenantId];
  if(isLocalDisponible(t)){
    btn.disabled=false;
    btn.textContent="Confirmar pedido ↗";
    btn.style.background="";
    btn.style.cursor="";
  } else {
    btn.disabled=true;
    btn.textContent="Local no disponible";
    btn.style.background="var(--ink-mute)";
    btn.style.cursor="not-allowed";
  }
}

function renderStoreBlockedBanner(){
  const panel=document.getElementById("panel-tienda");
  if(!panel)return;
  let banner=document.getElementById("store-blocked-banner");
  const t=tenants[currentTenantId];
  if(isLocalDisponible(t)){
    if(banner)banner.remove();
    return;
  }
  if(!banner){
    banner=document.createElement("div");
    banner.id="store-blocked-banner";
    banner.className="store-blocked-banner";
    // insertar después del header de la tienda
    const header=panel.querySelector(".store-header");
    if(header)header.after(banner);
    else panel.prepend(banner);
  }
  if(!isLocalActivo(t)){
    banner.innerHTML=`<strong>🚫 Local cerrado</strong><span>Esta verdulería no está aceptando pedidos por ahora. Volvé pronto.</span>`;
  } else if(!tieneEntregaHabilitada(t)){
    banner.innerHTML=`<strong>📭 Sin opciones de entrega</strong><span>Por ahora este local no acepta delivery ni retiro. Configurá una opción en <em>Costo de envío</em> para volver a vender.</span>`;
  }
}

function uploadPinPhoto(event){
  const file=event.target.files[0];
  if(!file)return;
  if(file.size>1.5*1024*1024){
    alert("La imagen es muy grande (máx 1.5MB). Usá una más chica.");
    return;
  }
  const reader=new FileReader();
  reader.onload=e=>{
    // Resize to ~120px square via canvas to keep storage small
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      const sz=120;canvas.width=sz;canvas.height=sz;
      const ctx=canvas.getContext("2d");
      // cover crop
      const min=Math.min(img.width,img.height);
      const sx=(img.width-min)/2, sy=(img.height-min)/2;
      ctx.drawImage(img,sx,sy,min,min,0,0,sz,sz);
      const dataUrl=canvas.toDataURL("image/jpeg",0.82);
      if(tenants[currentTenantId])tenants[currentTenantId].photo=dataUrl;
      pinStyle.content="foto";
      rebuildMapMarkers();
      renderPinStyleEditor();
      autoSave();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value="";
}

async function geocodeAddress(){
  const addr=document.getElementById("tf-direccion").value.trim();
  const zona=document.getElementById("tf-zona").value.trim();
  if(!addr){alert("Ingresá una dirección primero");return;}
  const status=document.getElementById("geocode-status");
  if(status)status.innerHTML='<span style="color:var(--ink-soft)">⏳ Buscando...</span>';
  const query=addr.toLowerCase().includes("argentina")?addr:`${addr}, ${zona?zona+", ":""}Buenos Aires, Argentina`;
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
    const data=await r.json();
    if(!data.length){
      if(status)status.innerHTML='<span style="color:var(--danger)">✗ No se encontró la dirección</span>';
      return;
    }
    const result=data[0];
    document.getElementById("tf-lat").value=parseFloat(result.lat).toFixed(6);
    document.getElementById("tf-lng").value=parseFloat(result.lon).toFixed(6);
    if(status)status.innerHTML=`<span style="color:var(--success-fg)">✓ Ubicación encontrada</span>`;
  }catch(err){
    if(status)status.innerHTML='<span style="color:var(--danger)">✗ Error de conexión</span>';
  }
}

function saveTenant(){
  const nombre=document.getElementById("tf-nombre").value.trim();
  if(!nombre){alert("El nombre es obligatorio");return;}
  const latVal=document.getElementById("tf-lat").value;
  const lngVal=document.getElementById("tf-lng").value;
  const data={
    icono:document.getElementById("tf-icono").value.trim()||"🥬",
    nombre,
    zona:document.getElementById("tf-zona").value.trim(),
    direccion:document.getElementById("tf-direccion").value.trim(),
    tel:document.getElementById("tf-tel").value.trim(),
    diasEnvio:document.getElementById("tf-dias").value.trim(),
    lat:latVal?parseFloat(latVal):null,
    lng:lngVal?parseFloat(lngVal):null,
  };
  if(editingTenant.isNew){
    const id="tenant_"+Date.now();
    const sourceEl=document.getElementById("tf-source");
    const source=sourceEl?sourceEl.value:"default";
    let snapshotData;
    if(source==="default"){
      tenants[currentTenantId].data=snapshotCurrentState();
      snapshotData=JSON.parse(JSON.stringify(tenants[currentTenantId].data));
    } else {
      snapshotData=JSON.parse(JSON.stringify(tenants[currentTenantId].data));
      Object.keys(snapshotData.costos).forEach(k=>{snapshotData.costos[k]=0;});
      Object.keys(snapshotData.pVentas).forEach(k=>{snapshotData.pVentas[k]=0;});
      Object.keys(snapshotData.stockState).forEach(k=>{
        snapshotData.stockState[k]={activo:false,stock:0,stockMin:5};
      });
    }
    tenants[id]={
      id,...data,
      creada:new Date().toISOString().slice(0,10),
      data:snapshotData
    };
    editingTenant=null;
    switchTenant(id);
    renderAdminContent();
    rebuildMapMarkers();
    saveToLocalStorage();
    alert(`✓ Restaurante "${nombre}" creada${data.lat!=null?" y agregada al mapa":""}`);
  } else {
    Object.assign(tenants[editingTenant.id],data);
    editingTenant=null;
    renderAdminContent();
    rebuildMapMarkers();
    saveToLocalStorage();
    updateGlobalHeader();
  }
}

function duplicateTenant(id){
  const orig=tenants[id];
  if(!orig)return;
  const newId="tenant_"+Date.now();
  if(id===currentTenantId){tenants[currentTenantId].data=snapshotCurrentState();}
  tenants[newId]={
    ...orig,id:newId,
    nombre:orig.nombre+" (copia)",
    creada:new Date().toISOString().slice(0,10),
    data:JSON.parse(JSON.stringify(orig.data))
  };
  renderAdminContent();
  rebuildMapMarkers();
  saveToLocalStorage();
  alert(`✓ Restaurante duplicado como "${tenants[newId].nombre}"`);
}

function deleteTenant(id){
  const t=tenants[id];
  if(!t)return;
  if(!confirm(`¿Eliminar el restaurante "${t.nombre}"?\n\nEsta acción no se puede deshacer.`))return;
  if(id===currentTenantId){
    const other=Object.keys(tenants).find(k=>k!==id);
    if(other)switchTenant(other);
  }
  delete tenants[id];
  renderAdminContent();
  rebuildMapMarkers();
  saveToLocalStorage();
}

let editingMyVerdu=false;

function renderDashboardContent(){
  const cont=document.getElementById("dashboard-content");
  const t=tenants[currentTenantId];
  if(!t){cont.innerHTML="<div style='padding:2rem;color:var(--ink-soft)'>No hay verdulería seleccionada</div>";return;}

  // Stats del tenant actual
  const MENU=getMenu();
  const totalProd=MENU.length;
  const activos=MENU.filter(r=>stockState[r.n]&&stockState[r.n].activo).length;
  const sinStock=MENU.filter(r=>stockState[r.n]&&stockState[r.n].activo&&stockState[r.n].stock<=0).length;
  const stockBajo=MENU.filter(r=>{const s=stockState[r.n];return s&&s.activo&&s.stock>0&&s.stock<=s.stockMin;}).length;
  const valorInv=MENU.reduce((a,r)=>a+((stockState[r.n]&&stockState[r.n].activo?stockState[r.n].stock:0)*(costos[r.n]||0)),0);
  const valorVenta=MENU.reduce((a,r)=>a+((stockState[r.n]&&stockState[r.n].activo?stockState[r.n].stock:0)*(pVentas[r.n]||0)),0);
  const gananciaPotencial=valorVenta-valorInv;
  const margenes=MENU.filter(r=>stockState[r.n]&&stockState[r.n].activo).map(r=>margen(costos[r.n],pVentas[r.n])).filter(x=>x!=null);
  const margenProm=margenes.length?margenes.reduce((a,b)=>a+b,0)/margenes.length:0;

  // Alertas
  const alerts=[];
  D.forEach(r=>{
    const s=stockState[r.n];
    if(!s||!s.activo)return;
    if(s.stock<=0)alerts.push({type:"crit",icon:"🚨",title:`${r.n}: sin stock`,meta:`Categoría ${r.c}`});
    else if(s.stock<=s.stockMin)alerts.push({type:"warn",icon:"⚠",title:`${r.n}: stock bajo (${s.stock} u.)`,meta:`Mínimo: ${s.stockMin}`});
    const mg=margen(costos[r.n],pVentas[r.n]);
    if(mg!=null&&mg<15&&s.activo)alerts.push({type:"warn",icon:"💸",title:`${r.n}: margen muy bajo (${Math.round(mg)}%)`,meta:`Venta ${fmt(pVentas[r.n])}`});
  });

  // Top ganancia
  const topGanancia=MENU.filter(r=>stockState[r.n]&&stockState[r.n].activo&&stockState[r.n].stock>0)
    .map(r=>({n:r.n,ganancia:(stockState[r.n].stock||0)*((pVentas[r.n]||0)-(costos[r.n]||0))}))
    .sort((a,b)=>b.ganancia-a.ganancia).slice(0,6);
  const maxGan=Math.max(...topGanancia.map(x=>x.ganancia),1);

  // Status donut
  const statusCount={ok:0,low:0,out:0,off:0};
  MENU.forEach(r=>{const st=stockStatus(r.n);statusCount[st]++;});
  const totalStat=statusCount.ok+statusCount.low+statusCount.out+statusCount.off;
  let cumAngle=0;
  const donutSegs=[
    {key:"ok",label:"Con stock",color:"var(--success)",count:statusCount.ok},
    {key:"low",label:"Stock bajo",color:"var(--warn)",count:statusCount.low},
    {key:"out",label:"Sin stock",color:"var(--danger)",count:statusCount.out},
    {key:"off",label:"Inactivos",color:"var(--ink-soft)",count:statusCount.off},
  ].map(s=>{
    const angle=totalStat?(s.count/totalStat)*360:0;
    const start=cumAngle;cumAngle+=angle;
    return{...s,start,end:cumAngle,angle};
  });

    const x1=cx+r*Math.cos(sr-Math.PI/2),y1=cy+r*Math.sin(sr-Math.PI/2);
    const x2=cx+r*Math.cos(er-Math.PI/2),y2=cy+r*Math.sin(er-Math.PI/2);
    const large=(end-start)>180?1:0;

async function geocodeMyAddress(){
  const addr=document.getElementById("mv-direccion").value.trim();
  const zona=document.getElementById("mv-zona").value.trim();
  if(!addr){alert("Ingresá una dirección primero");return;}
  const status=document.getElementById("mv-geo-status");
  if(status)status.innerHTML='<span style="color:var(--ink-soft)">⏳ Buscando...</span>';
  const query=addr.toLowerCase().includes("argentina")?addr:`${addr}, ${zona?zona+", ":""}Buenos Aires, Argentina`;
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
    const data=await r.json();
    if(!data.length){if(status)status.innerHTML='<span style="color:var(--danger)">✗ No encontrada</span>';return;}
    const result=data[0];
    document.getElementById("mv-lat").value=parseFloat(result.lat).toFixed(6);
    document.getElementById("mv-lng").value=parseFloat(result.lon).toFixed(6);
    if(status)status.innerHTML='<span style="color:var(--success-fg)">✓ Encontrada</span>';
  }catch(err){
    if(status)status.innerHTML='<span style="color:var(--danger)">✗ Error</span>';
  }
}

function goToTab(id){

  if(id==="admin")id="socios";
  const tab=TABS.find(t=>t.id===id);
  if(!tab)return;
  if(tab.group!==activeGroup){
    activeGroup=tab.group;
    document.querySelectorAll(".group-pill").forEach(p=>p.classList.toggle("on",p.dataset.group===activeGroup));
    document.body.dataset["activeIn_"+activeGroup]=id;
    renderTabsForGroup();
    return;
  }
  // Activación directa del panel (funciona también para tabs hidden)
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tabId===id));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"));
  document.getElementById("panel-"+id)?.classList.add("on");
  document.body.dataset["activeIn_"+activeGroup]=id;
  renderTab(id);
}

// ─── PERSISTENCIA EN LOCALSTORAGE ─────────────────────────
const STORAGE_KEY="izifud_app_v1";
let saveTimer=null;
let lastSaveTime=null;

function saveToLocalStorage(){
  try{
    // Make sure current tenant has latest snapshot
    if(tenants[currentTenantId]){
      tenants[currentTenantId].data=snapshotCurrentState();
    }
    const payload={
      version:1,
      currentTenantId,
      tenants,
      riders,
      pinStyle,
      savedAt:new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY,JSON.stringify(payload));
    lastSaveTime=new Date();
    updateSaveStatus();
    return true;
  }catch(e){
    console.error("Error guardando:",e);
    return false;
  }
}

function loadFromLocalStorage(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    const data=JSON.parse(raw);
    if(!data.tenants||!data.currentTenantId)return false;
    tenants=data.tenants;
    currentTenantId=data.currentTenantId;
    riders=Array.isArray(data.riders)&&data.riders.length?data.riders:[];
    if(!riders.length)initRiders();
    if(data.pinStyle)pinStyle={...DEFAULT_PIN_STYLE,...data.pinStyle};
    if(!tenants[currentTenantId]){
      currentTenantId=Object.keys(tenants)[0];
    }
    if(tenants[currentTenantId]){
      loadTenantState(tenants[currentTenantId]);
    }
    return true;
  }catch(e){
    console.error("Error cargando:",e);
    return false;
  }
}

function autoSave(){
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>saveToLocalStorage(),800);
}

function forceSave(){
  if(saveToLocalStorage()){
    alert("✓ Datos guardados en el navegador");
  } else {
    alert("✗ Error al guardar");
  }
}

function updateSaveStatus(){
  const el=document.getElementById("save-status");
  if(!el)return;
  if(lastSaveTime){
    el.textContent=`Último guardado: ${lastSaveTime.toLocaleTimeString("es-AR")}`;
  } else {
    el.textContent="Aún no se guardó en esta sesión";
  }
}

function exportAllData(){
  // Save current state before exporting
  if(tenants[currentTenantId]){
    tenants[currentTenantId].data=snapshotCurrentState();
  }
  const payload={
    version:1,
    currentTenantId,
    tenants,
    exportedAt:new Date().toISOString()
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`verduleria_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importAllData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.tenants||!data.currentTenantId)throw new Error("Archivo inválido");
      if(!confirm("¿Reemplazar todos los datos actuales con los del archivo?\n\nLos datos actuales se perderán."))return;
      tenants=data.tenants;
      currentTenantId=data.currentTenantId;
      if(!tenants[currentTenantId])currentTenantId=Object.keys(tenants)[0];
      loadTenantState(tenants[currentTenantId]);
      saveToLocalStorage();
      // Reset all panels
      ["original","kg","margen","sugeridos","envio","estacional","proveedor","pedidos","tienda","recetas","stock","dashboard","admin"].forEach(id=>{
        const p=document.getElementById("panel-"+id);
        if(p)delete p.dataset.init;
      });
      updateGlobalHeader();
      renderDashboard();
      alert("✓ Datos importados correctamente");
    }catch(err){
      alert("Error al importar: "+err.message);
    }
  };
  reader.readAsText(file);
  event.target.value="";
}

function resetAllData(){
  if(!confirm("¿Borrar TODOS los datos guardados?\n\nEsto eliminará todas las verdulerías, precios y stock que hayas configurado. No se puede deshacer."))return;
  if(!confirm("Estás seguro de esta acción permanente?"))return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// ─── RIDERS (flota de plataforma) ─────────────────────────
function allPedidosCrossTenant(){
  const out=[];
  Object.values(tenants).forEach(t=>{
    const lista=t.id===currentTenantId?pedidos:((t.data&&t.data.pedidos)||[]);
    (lista||[]).forEach(p=>out.push({p,tenant:t}));
  });
  return out;
}

function mutarPedidoCrossTenant(tenantId,pedidoId,fn){
  const lista=tenantId===currentTenantId?pedidos:(tenants[tenantId]&&tenants[tenantId].data&&tenants[tenantId].data.pedidos);
  const p=(lista||[]).find(x=>x.id===pedidoId);
  if(!p)return false;
  fn(p);
  saveToLocalStorage();
  return true;
}

function getDevRider(){
  const saved=localStorage.getItem("izifud_dev_rider");
  const activos=riders.filter(r=>r.activo);
  return activos.find(r=>r.id===saved)||activos[0]||null;
}

function setDevRider(id){
  localStorage.setItem("izifud_dev_rider",id);
  updateDevRiderSelect();
  renderEntregas();
  const ph=document.getElementById("panel-rider-historial");
  if(ph&&ph.classList.contains("on"))renderRiderHistorial();
}

    :`<option value="">Sin riders activos</option>`;
}

function riderToggleLinea(id,v){

function riderTomar(tenantId,pedidoId){

  mutarPedidoCrossTenant(tenantId,pedidoId,p=>{p.estado="en_camino";p.riderId=yo.id;});

}

function riderIniciar(tenantId,pedidoId){
  mutarPedidoCrossTenant(tenantId,pedidoId,p=>{p.estado="en_camino";});
  renderEntregas();
  refreshPedidosSocioSiVisible();

function riderEntregar(tenantId,pedidoId){
  mutarPedidoCrossTenant(tenantId,pedidoId,p=>{p.estado="entregado";});
  renderEntregas();
  refreshPedidosSocioSiVisible();
}

// ── Mapa de ruta del rider (retiro 🏪 → entrega 🏠) ──
let rutaMaps={};
function destroyRutaMaps(){
  Object.values(rutaMaps).forEach(m=>{try{m.remove();}catch(e){}});
  rutaMaps={};
}

function toggleRutaMapa(tenantId,pedidoId){
  const wrap=document.getElementById("ruta-"+pedidoId);
  const btn=document.getElementById("rbtn-"+pedidoId);
  if(!wrap)return;
  const abierto=wrap.classList.toggle("show");
  if(btn)btn.textContent=abierto?"Ocultar mapa":"🗺 Ver mapa";
  if(!abierto){
    if(rutaMaps[pedidoId]){try{rutaMaps[pedidoId].remove();}catch(e){}delete rutaMaps[pedidoId];}
    wrap.innerHTML="";
    return;
  }
  setTimeout(()=>buildRutaMapa(tenantId,pedidoId),50);
}

async function buildRutaMapa(tenantId,pedidoId){
  if(typeof L==="undefined")return;
  const wrap=document.getElementById("ruta-"+pedidoId);
  const t=tenants[tenantId];
  const x=allPedidosCrossTenant().find(e=>e.p.id===pedidoId);
  if(!wrap||!t||!x||rutaMaps[pedidoId])return;
  const centro=[t.lat!=null?t.lat:DEFAULT_CENTER.lat,t.lng!=null?t.lng:DEFAULT_CENTER.lng];
  const m=L.map(wrap,{zoomControl:false,attributionControl:false,scrollWheelZoom:false}).setView(centro,13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(m);
  rutaMaps[pedidoId]=m;
  const pin=emoji=>L.divIcon({className:"ruta-pin",html:`<div class="ruta-pin-in">${emoji}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
  const pts=[];
  if(t.lat!=null&&t.lng!=null){
    L.marker([t.lat,t.lng],{icon:pin("🏪")}).addTo(m).bindPopup(`<b>${t.icono||"🍽"} ${t.nombre}</b><br>${t.direccion||""}`);
    pts.push([t.lat,t.lng]);
  }
  let cli=x.p.cliente&&x.p.cliente.coords;
  const dirCli=x.p.cliente&&x.p.cliente.direccion;
  if(!cli&&dirCli){
    // Pedidos sin pin del cliente: geocodificar la dirección y guardarla en el pedido
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(dirCli+", Buenos Aires, Argentina")}&limit=1`);
      const js=await r.json();
      if(js&&js[0]){
        cli={lat:parseFloat(js[0].lat),lng:parseFloat(js[0].lon)};
        mutarPedidoCrossTenant(tenantId,pedidoId,pp=>{if(pp.cliente)pp.cliente.coords=cli;});
      }
    }catch(e){}
  }
  if(!rutaMaps[pedidoId])return;// se cerró mientras geocodificaba
  if(cli&&cli.lat!=null){
    L.marker([cli.lat,cli.lng],{icon:pin("🏠")}).addTo(m).bindPopup(`<b>Cliente</b><br>${dirCli||""}`);
    pts.push([cli.lat,cli.lng]);
    if(pts.length===2)L.polyline(pts,{color:"#18181b",weight:2,dashArray:"6 6",opacity:.7}).addTo(m);
  }
  if(pts.length>1)m.fitBounds(L.latLngBounds(pts).pad(0.3));
  else if(pts.length===1)m.setView(pts[0],14);
  setTimeout(()=>{try{m.invalidateSize();}catch(e){}},80);
}

function renderRiderHistorial(){
  const p=document.getElementById("panel-rider-historial");
