  if(!yo){
    p.innerHTML=`<div class="pedido-empty"><strong>No hay riders activos</strong>El admin puede dar de alta riders en Plataforma → 🛵 Riders.</div>`;
    return;
  }
  const done=allPedidosCrossTenant()
    .filter(x=>x.p.estado==="entregado"&&x.p.riderId===yo.id)
    .sort((a,b)=>new Date(b.p.fecha)-new Date(a.p.fecha));
  const hoyStr=new Date().toDateString();
  const deHoy=done.filter(x=>new Date(x.p.fecha).toDateString()===hoyStr).length;
  const valor=done.reduce((a,x)=>a+x.p.total,0);
  const fmtFecha=iso=>{
    const f=new Date(iso);
    return f.toLocaleDateString("es-AR",{day:"2-digit",month:"short"})+" "+f.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  };
  p.innerHTML=`
    <div class="rider-head">
      <div class="rh-nombre">${(yo.vehiculo||"🛵").split(" ")[0]} <strong>${yo.nombre}</strong></div>
      <div class="rh-stats">
        <span>Entregas <strong>${done.length}</strong></span>
        <span>Hoy <strong>${deHoy}</strong></span>
        <span>Valor entregado <strong>${fmt(valor)||"$0"}</strong></span>
      </div>
    </div>
    ${done.length?done.map(x=>`
      <div class="mp-card mp-past">
        <div class="mp-card-top">
          <div class="mp-rest">${x.tenant.icono||"🍽"} <strong>${x.tenant.nombre}</strong></div>
          <span class="mp-meta">#${x.p.id} · ${fmtFecha(x.p.fecha)}</span>
          <span class="mp-total">${fmt(x.p.total)}</span>
        </div>
        <div class="mp-entrega">🏠 ${(x.p.cliente&&x.p.cliente.direccion)||"Sin dirección"}</div>
      </div>`).join(""):`<div class="pedido-empty"><strong>Todavía no entregaste pedidos</strong>Cuando marques entregas como completadas, quedan acá.</div>`}
    <p class="foot">Historial de entregas completadas por este rider en todos los locales de la plataforma.</p>`;
}

function guardarRider(){
  const nombre=(document.getElementById("rid-nombre")?.value||"").trim();
  if(!nombre){alert("El nombre es obligatorio");return;}
  const datos={
    nombre,
    tel:(document.getElementById("rid-tel")?.value||"").trim(),
    vehiculo:document.getElementById("rid-veh")?.value||"🛵 Moto",
    turno:(document.getElementById("rid-turno")?.value||"").trim()
  };
  if(editingRiderId){
    const r=riders.find(x=>x.id===editingRiderId);
    if(r)Object.assign(r,datos);
    editingRiderId=null;
  }else{
    riders.push({id:"r_"+Date.now().toString(36),...datos,activo:true,enLinea:false});
  }
  saveToLocalStorage();
  renderRiders();
  updateDevRiderSelect();
}

function riderToggleActivo(id){
  const r=riders.find(x=>x.id===id);
  if(r){r.activo=!r.activo;saveToLocalStorage();renderRiders();updateDevRiderSelect();}
}

function eliminarRider(id){
  const r=riders.find(x=>x.id===id);
  if(!r)return;
  if(!confirm(`¿Eliminar al rider "${r.nombre}"?`))return;
  riders=riders.filter(x=>x.id!==id);
  if(editingRiderId===id)editingRiderId=null;
  saveToLocalStorage();
  renderRiders();
  updateDevRiderSelect();
}

let misPedidosRefs=[];
try{misPedidosRefs=JSON.parse(localStorage.getItem("izifud_mis_pedidos")||"[]")||[];}catch(e){misPedidosRefs=[];}

function registrarMiPedido(tenantId,pedidoId){
  misPedidosRefs.unshift({t:tenantId,id:pedidoId});
  misPedidosRefs=misPedidosRefs.slice(0,30);
  localStorage.setItem("izifud_mis_pedidos",JSON.stringify(misPedidosRefs));

}

function misPedidos(){
  const todos=allPedidosCrossTenant();
  return misPedidosRefs
    .map(ref=>todos.find(x=>x.tenant.id===ref.t&&x.p.id===ref.id))
    .filter(Boolean);
}

function updateMisPedidosBadge(){
  const b=document.getElementById("mp-badge");
  if(!b)return;
  const act=misPedidos().filter(x=>["pendiente","preparando","en_camino"].includes(x.p.estado)).length;
  b.textContent=act>9?"9+":String(act||"");
  b.classList.toggle("show",act>0);
}

function mpStepper(p){
  const pickup=p.tipoEntrega==="pickup";
  const steps=pickup
    ?[["pendiente","Recibido"],["preparando","En preparación"],["entregado","Entregado"]]
    :[["pendiente","Recibido"],["preparando","En preparación"],["en_camino","En camino"],["entregado","Entregado"]];
  const idx=steps.findIndex(s=>s[0]===p.estado);
  return`<div class="mp-steps">${steps.map((s,i)=>{
    const done=i<idx||p.estado==="entregado";
    const cls=done?"done":(i===idx?"now":"");
    return`<div class="mp-step ${cls}"><div class="mp-dot">${done?"✓":""}</div><div class="mp-lbl">${s[1]}</div></div>`;
  }).join("")}</div>`;
}

function renderMisPedidos(){
  const el=document.getElementById("panel-mis-pedidos");
  if(!el)return;
  const lista=misPedidos();
  updateMisPedidosBadge();
  const head=`
    <div class="mp-head">
      <button class="mp-volver" onclick="goToTab('home')">← Restaurantes</button>
      <h2>📦 Mis pedidos</h2>
    </div>`;
  if(!lista.length){
    el.innerHTML=`${head}<div class="pedido-empty"><strong>Todavía no hiciste pedidos</strong>Elegí un restaurante, armá tu pedido y acá vas a poder seguir el estado.</div>`;
    return;
  }
  const enCurso=lista.filter(x=>["pendiente","preparando","en_camino"].includes(x.p.estado));
  const pasados=lista.filter(x=>!["pendiente","preparando","en_camino"].includes(x.p.estado));
  const fmtFecha=iso=>{
    const f=new Date(iso);
    return f.toLocaleDateString("es-AR",{day:"2-digit",month:"short"})+" "+f.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  };
  const resumenItems=p=>{
    const vis=p.items.slice(0,3).map(i=>`${i.emoji} ${i.nombre} ×${i.qty}`).join(" · ");
    const resto=p.items.length-3;
    return vis+(resto>0?` · +${resto} más`:"");
  };
  const cardActivo=x=>{
    const p=x.p,t=x.tenant;
    const rider=p.riderId?riders.find(r=>r.id===p.riderId):null;
    const pickup=p.tipoEntrega==="pickup";
    const msg={
      pendiente:`${t.nombre} está confirmando tu pedido.`,
      preparando:pickup
        ?"Tu pedido se está preparando. Cuando esté listo, pasá a retirarlo."
        :(rider?`Tu pedido se está preparando. Lo va a llevar ${rider.nombre}.`:"Tu pedido se está preparando."),
      en_camino:rider
        ?`${(rider.vehiculo||"🛵").split(" ")[0]} ${rider.nombre} está yendo con tu pedido.`
        :"Tu pedido está en camino.",
    }[p.estado]||"";
    return`<div class="mp-card">
      <div class="mp-card-top">
        <div class="mp-rest">${t.icono||"🍽"} <strong>${t.nombre}</strong></div>
        <span class="mp-meta">#${p.id} · ${fmtFecha(p.fecha)}</span>
        <span class="mp-total">${fmt(p.total)}</span>
      </div>
      ${mpStepper(p)}
      ${msg?`<div class="mp-msg">${msg}</div>`:""}
      <div class="mp-items">${resumenItems(p)}</div>
      <div class="mp-entrega">${pickup?`🏪 Retiro en ${t.direccion||"el local"}`:`🛵 Delivery a ${(p.cliente&&p.cliente.direccion)||"tu dirección"}`}</div>
    </div>`;
  };
  const cardPasado=x=>{
    const p=x.p,t=x.tenant;
    const lbl={entregado:"Entregado",cancelado:"Cancelado"}[p.estado]||p.estado;
    return`<div class="mp-card mp-past">
      <div class="mp-card-top">
        <div class="mp-rest">${t.icono||"🍽"} <strong>${t.nombre}</strong></div>
        <span class="mp-meta">${fmtFecha(p.fecha)} · ${p.items.length} ítem${p.items.length===1?"":"s"}</span>
        <span class="pedido-status ${p.estado}">${lbl}</span>
        <span class="mp-total">${fmt(p.total)}</span>
      </div>
    </div>`;
  };
  el.innerHTML=`${head}
    ${enCurso.length?`<div class="rider-section-title">En curso (${enCurso.length})</div>${enCurso.map(cardActivo).join("")}`:""}
    ${pasados.length?`<div class="rider-section-title">Historial (${pasados.length})</div>${pasados.map(cardPasado).join("")}`:""}
    <p class="foot">El estado se actualiza solo a medida que el local y el rider avanzan. Más adelante: mapa con la ubicación del rider en vivo.</p>`;
}

        <div class="meta">Mín envío gratis: ${fmt(z.freeMin)}</div>
      </div>
      <div class="meta">
        ${fmt(z.costoFijo)}<br>
        ${z.tiempoMin}–${z.tiempoMax} min
      </div>
    </div>`).join("")||`<div style="color:var(--ink-mute);font-size:12px">Sin zonas configuradas.</div>`;
  const FAQ=[
    {q:"¿Cuál es el monto mínimo de pedido?",a:`Cada zona tiene su mínimo para envío gratis. Si no llegás, se cobra el costo fijo de la zona (entre $${(zonas[0]?.costoFijo||1500).toLocaleString("es-AR")} y $${(zonas[zonas.length-1]?.costoFijo||5000).toLocaleString("es-AR")}).`},
    {q:"¿En cuánto tiempo me llega el pedido?",a:"Entre 30 y 180 minutos según tu zona. El detalle exacto está en la sección Zonas de envío."},
    {q:"¿Cómo pago?",a:"Aceptamos efectivo al recibir, transferencia, Mercado Pago y tarjeta al recibir. Elegís la forma al confirmar el pedido."},
    {q:"¿Puedo retirar en el local?",a:"Sí, en el carrito elegí \"🏪 Retiro en local\" antes de confirmar. El retiro no tiene costo de envío."},
    {q:"¿Puedo cancelar un pedido?",a:"Sí, mientras esté en estado Pendiente o Preparando podés cancelarlo desde la tab Pedidos."},
    {q:"¿Puedo pedir de varios restaurantes a la vez?",a:"Por ahora cada pedido es de un solo restaurante. Elegí el local, armá el carrito y confirmá; después podés hacer otro pedido en otro local."},
  ];
  const faqHTML=FAQ.map(f=>`<div class="info-faq-item"><div class="q">${f.q}</div><div class="a">${f.a}</div></div>`).join("");
  el.innerHTML=`
    <div class="info-tenant-card">
      <div class="info-tenant-head">
        <div class="info-tenant-icon">${t.icono||"🥬"}</div>
        <div class="info-tenant-name">
          <h3>${t.nombre||"Verdulería"}</h3>
          <div class="meta">${t.zona||""}${t.direccion?" · "+t.direccion:""}</div>
        </div>
      </div>
      <div class="info-contact-row">
        ${t.tel?`<div><span>Teléfono</span><strong>${t.tel}</strong></div>`:""}
        ${t.diasEnvio?`<div><span>Atención</span><strong>${t.diasEnvio}</strong></div>`:""}
        <div><span>Zonas activas</span><strong>${(zonas||[]).length}</strong></div>
        <div><span>Platos</span><strong>${getMenu().filter(r=>stockState[r.n]&&stockState[r.n].activo).length}</strong></div>
      </div>
    </div>

    <div class="info-section open" id="info-sec-como">
      <div class="info-section-head" onclick="toggleInfoSection('info-sec-como')">
        <h4>🛒 Cómo comprar</h4>
        <div class="info-chev">▾</div>
      </div>
      <div class="info-section-body">
        <div class="info-steps">
          <div class="info-step"><div><strong>Elegí tus platos</strong><span>Navegá la carta y agregá lo que quieras al carrito. Podés filtrar por categoría o buscar por nombre.</span></div></div>
          <div class="info-step"><div><strong>Abrí el carrito</strong><span>Revisá el subtotal y elegí si querés delivery a tu casa o retiro en el local.</span></div></div>
          <div class="info-step"><div><strong>Completá tus datos</strong><span>Dirección (si es delivery), teléfono, correo opcional y forma de pago.</span></div></div>
          <div class="info-step"><div><strong>Confirmá el pedido</strong><span>Te aparece un código de pedido (ORD-…). Podés seguir su estado desde la tab Pedidos.</span></div></div>
        </div>
      </div>
    </div>

    <div class="info-section" id="info-sec-zonas">
      <div class="info-section-head" onclick="toggleInfoSection('info-sec-zonas')">
        <h4>🛵 Zonas de envío</h4>
        <div class="info-chev">▾</div>
      </div>
      <div class="info-section-body">
        <div class="info-zona-list">${zonasHTML}</div>
        <p style="margin-top:10px;font-size:11px;color:var(--ink-mute)">Si tu pedido supera el mínimo de tu zona, el envío es gratis. Si no, se suma el costo fijo. El retiro en local no tiene costo.</p>
      </div>
    </div>

    <div class="info-section" id="info-sec-faq">
      <div class="info-section-head" onclick="toggleInfoSection('info-sec-faq')">
        <h4>❓ Preguntas frecuentes</h4>
        <div class="info-chev">▾</div>
      </div>
      <div class="info-section-body">
        <div class="info-faq-list">${faqHTML}</div>
      </div>
    </div>

    <div class="info-section" id="info-sec-contacto">
      <div class="info-section-head" onclick="toggleInfoSection('info-sec-contacto')">
        <h4>📞 Contacto</h4>
        <div class="info-chev">▾</div>
      </div>
      <div class="info-section-body">
        ${t.tel?`<p><strong style="color:var(--ink)">Teléfono / WhatsApp:</strong> ${t.tel}</p>`:""}
        ${t.direccion?`<p style="margin-top:6px"><strong style="color:var(--ink)">Local:</strong> ${t.direccion}</p>`:""}
        ${t.diasEnvio?`<p style="margin-top:6px"><strong style="color:var(--ink)">Horario:</strong> ${t.diasEnvio}</p>`:""}
        <p style="margin-top:10px;color:var(--ink-mute);font-size:11px">¿Dudas que no están en el FAQ? Escribinos por WhatsApp.</p>
      </div>
    </div>
  `;
}

function renderSiteFooter(){
  // Inyecta el footer al final del body si todavía no existe
  if(document.querySelector(".site-footer"))return;
  const t=tenants[currentTenantId]||{};
  const footer=document.createElement("footer");
  footer.className="site-footer";
  document.body.appendChild(footer);
  updateSiteFooter();
}

function updateSiteFooter(){
  const footer=document.querySelector(".site-footer");
  if(!footer)return;
  const t=tenants[currentTenantId]||{};
  const year=new Date().getFullYear();
  footer.innerHTML=`
    <div class="footer-cols">
      <div class="footer-col">
        <h4>Tienda</h4>
        <a class="fl" onclick="goToTab('tienda')">Carta</a>
        <a class="fl" onclick="goToTab('ubicacion')">Locales</a>
        <a class="fl" onclick="goToTab('mis-pedidos')">Mis pedidos</a>
      </div>
      <div class="footer-col">
        <h4>Ayuda</h4>
        <a class="fl" onclick="openInfo('como')">Cómo comprar</a>
        <a class="fl" onclick="openInfo('zonas')">Zonas de envío</a>
        <a class="fl" onclick="openInfo('faq')">Preguntas frecuentes</a>
        <a class="fl" onclick="openInfo('contacto')">Contacto</a>
      </div>
      <div class="footer-col">
        <h4>${t.icono||"🥬"} ${t.nombre||"Verdulería"}</h4>
        <div class="fl-meta">${t.direccion||""}</div>
        <div class="fl-meta">${t.zona||""}</div>
        ${t.tel?`<div class="fl-meta" style="margin-top:6px">${t.tel}</div>`:""}
        ${t.diasEnvio?`<div class="fl-meta">${t.diasEnvio}</div>`:""}
      </div>
      <div class="footer-col">
        <h4>Seguinos</h4>
        <a class="fl" onclick="alert('Conectá tu Instagram desde Admin')">📷 Instagram</a>
        <a class="fl" onclick="alert('Conectá tu Facebook desde Admin')">📘 Facebook</a>
        <a class="fl" onclick="alert('Conectá tu WhatsApp desde Admin')">💬 WhatsApp</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© ${year} · IZIFUD · ${t.nombre||"Restaurante"}</span>
      <span>Activa desde ${t.creada||"—"}</span>
    </div>`;
}
</script>
</body>
</html>
