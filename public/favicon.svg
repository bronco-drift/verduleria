    <!-- Stem outline -->
    <path d="M 184 285 L 184 470 Q 184 502 256 504 Q 328 502 328 470 L 328 285 Z"/>
    <!-- Cogollo outline -->
    <circle cx="78" cy="178" r="82"/>
    <circle cx="170" cy="88" r="88"/>
    <circle cx="272" cy="60" r="102"/>
    <circle cx="378" cy="120" r="92"/>
    <circle cx="436" cy="218" r="78"/>
    <circle cx="58" cy="252" r="76"/>
    <circle cx="140" cy="208" r="83"/>
    <circle cx="240" cy="148" r="96"/>
    <circle cx="362" cy="205" r="86"/>
    <circle cx="170" cy="288" r="74"/>
    <circle cx="335" cy="292" r="74"/>
    <circle cx="256" cy="248" r="86"/>
  </g>

  <!-- Stem fill -->
  <path d="M 196 295 L 196 462 Q 196 492 256 494 Q 316 492 316 462 L 316 295 Z"
        fill="#c8db73"/>
  <!-- Stem highlight -->
  <line x1="248" y1="320" x2="248" y2="470" stroke="#e8f2b0" stroke-width="6" stroke-linecap="round" opacity="0.75"/>

  <!-- Cogollo back (darker) -->
  <g fill="#3a6f1d">
    <circle cx="78" cy="178" r="72"/>
    <circle cx="170" cy="88" r="78"/>
    <circle cx="272" cy="60" r="92"/>
    <circle cx="378" cy="120" r="82"/>
    <circle cx="436" cy="218" r="68"/>
    <circle cx="58" cy="252" r="66"/>
  </g>
  <!-- Cogollo front (brighter) -->
  <g fill="#76b342">
    <circle cx="140" cy="208" r="73"/>
    <circle cx="240" cy="148" r="86"/>
    <circle cx="362" cy="205" r="76"/>
    <circle cx="170" cy="288" r="64"/>
    <circle cx="335" cy="292" r="64"/>
    <circle cx="256" cy="248" r="76"/>
  </g>
  <!-- Floret highlights -->
  <g fill="#a8d472" opacity="0.75">
    <circle cx="228" cy="138" r="11"/>
    <circle cx="288" cy="162" r="9"/>
    <circle cx="170" cy="200" r="8"/>
